<!--
  Splitbutton — reference markup for server templates.
  Root: <div class="dx-splitbutton dx-splitbutton--<size>" data-dx-splitbutton>
  Modifiers:
    size    --sm | --md | --lg     (default: --md)
  Action: <button type="button" class="dx-splitbutton__action"
        data-dx-splitbutton-action> Label
  Caret: <button type="button" class="dx-splitbutton__caret" aria-label="More actions"
        aria-haspopup="menu" aria-expanded="false" aria-controls="<menu-id>"
        data-dx-splitbutton-caret> (chevron glyph)
  Menu: <div role="menu" id="<menu-id>" class="dx-splitbutton__menu"
        aria-activedescendant="<active-item-id>" data-dx-splitbutton-menu hidden>
    Items: <div role="menuitem" id class="dx-splitbutton__item"
        data-dx-splitbutton-item data-dx-splitbutton-action="<key>">
        (add data-dx-splitbutton-danger for the danger variant)
  Behavior: the caret toggles the menu; Arrow keys/Home/End move the
  active item, Enter/Space activate it, Escape closes and restores focus
  to the caret. Activating dispatches dx:splitbutton-activate with detail
  {key}. Outside clicks close the menu.
-->

<div class="dx-splitbutton dx-splitbutton--md" data-dx-splitbutton>
  <button type="button" class="dx-splitbutton__action" data-dx-splitbutton-action>
    Save
  </button>
  <button
    type="button"
    class="dx-splitbutton__caret"
    aria-label="More actions"
    aria-haspopup="menu"
    aria-expanded="false"
    aria-controls="sb1-menu"
    data-dx-splitbutton-caret
  >
    ▾
  </button>
  <div
    role="menu"
    id="sb1-menu"
    class="dx-splitbutton__menu"
    aria-activedescendant="sb1-item-1"
    data-dx-splitbutton-menu
    hidden
  >
    <div
      role="menuitem"
      id="sb1-item-1"
      class="dx-splitbutton__item"
      data-dx-splitbutton-item
      data-dx-splitbutton-action="save-as"
    >
      Save as…
    </div>
    <div
      role="menuitem"
      id="sb1-item-2"
      class="dx-splitbutton__item"
      data-dx-splitbutton-item
      data-dx-splitbutton-action="duplicate"
    >
      Duplicate
    </div>
    <div
      role="menuitem"
      id="sb1-item-3"
      class="dx-splitbutton__item dx-splitbutton__item--disabled"
      data-dx-splitbutton-item
      data-dx-splitbutton-action="archive"
      aria-disabled="true"
    >
      Archive (unavailable)
    </div>
    <div
      role="menuitem"
      id="sb1-item-4"
      class="dx-splitbutton__item dx-splitbutton__item--danger"
      data-dx-splitbutton-item
      data-dx-splitbutton-action="delete"
      data-dx-splitbutton-danger
    >
      Delete
    </div>
  </div>
</div>

<div class="dx-splitbutton dx-splitbutton--sm" data-dx-splitbutton>
  <button type="button" class="dx-splitbutton__action" data-dx-splitbutton-action>
    Share
  </button>
  <button
    type="button"
    class="dx-splitbutton__caret"
    aria-label="More actions"
    aria-haspopup="menu"
    aria-expanded="false"
    aria-controls="sb2-menu"
    data-dx-splitbutton-caret
  >
    ▾
  </button>
  <div
    role="menu"
    id="sb2-menu"
    class="dx-splitbutton__menu"
    aria-activedescendant="sb2-item-1"
    data-dx-splitbutton-menu
    hidden
  >
    <div
      role="menuitem"
      id="sb2-item-1"
      class="dx-splitbutton__item"
      data-dx-splitbutton-item
      data-dx-splitbutton-action="link"
    >
      Copy link
    </div>
    <div
      role="menuitem"
      id="sb2-item-2"
      class="dx-splitbutton__item"
      data-dx-splitbutton-item
      data-dx-splitbutton-action="email"
    >
      Email
    </div>
  </div>
</div>
