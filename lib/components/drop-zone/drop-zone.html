<!--
  DropZone — reference markup for server templates.
  Root: <div class="dx-dropzone" data-dx-dropzone
        [data-dx-dropzone-accept="image/*"] [data-dx-dropzone-multiple]>
    <p class="dx-dropzone-caption">Drop files here or browse</p>
    <button class="dx-dropzone-browse" type="button" data-dx-dropzone-browse>Browse</button>
    <input class="dx-dropzone-input" type="file" hidden
           data-dx-dropzone-input [multiple] [accept="…"]>
  behaviors.js wires dragenter/dragover/dragleave/drop (--dragging visual,
  caption swap, accept filter) and dispatches dx:dropzone-drop with a
  FileList on the root.
-->

<div class="dx-dropzone" data-dx-dropzone role="region" aria-label="Drop files here or browse">
  <p class="dx-dropzone-caption" data-dx-dropzone-caption>Drop files here or browse</p>
  <button class="dx-dropzone-browse" type="button" data-dx-dropzone-browse>Browse</button>
  <input class="dx-dropzone-input" type="file" hidden data-dx-dropzone-input />
</div>

<div class="dx-dropzone" data-dx-dropzone data-dx-dropzone-multiple data-dx-dropzone-accept="image/*" role="region" aria-label="Drop images here or browse">
  <p class="dx-dropzone-caption" data-dx-dropzone-caption>Drop images here or browse</p>
  <button class="dx-dropzone-browse" type="button" data-dx-dropzone-browse>Browse</button>
  <input class="dx-dropzone-input" type="file" hidden data-dx-dropzone-input multiple accept="image/*" />
</div>

<div class="dx-dropzone" data-dx-dropzone data-dx-dropzone-disabled role="region" aria-label="Drop zone disabled">
  <p class="dx-dropzone-caption" data-dx-dropzone-caption>Drop zone disabled</p>
  <button class="dx-dropzone-browse" type="button" data-dx-dropzone-browse disabled>Browse</button>
  <input class="dx-dropzone-input" type="file" hidden data-dx-dropzone-input disabled />
</div>
