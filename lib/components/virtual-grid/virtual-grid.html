<!--
  VirtualGrid — reference markup for server templates (htmx paging pattern).
  Root: <div class="dx-virtual-grid" data-dx-virtual-grid role="grid"
        aria-label="Virtual grid" aria-rowcount="1000" tabindex="0"
        hx-get="/rows?skip=0&top=20" hx-trigger="revealed" hx-target="[data-dx-virtual-rows]" hx-swap="beforeend">
    <div class="dx-virtual-header" role="row">
      <div class="dx-virtual-head-cell" role="columnheader">Name</div>
    </div>
    <div data-dx-virtual-rows>
      <div class="dx-virtual-row" role="row" style="--row-h: 40px">
        <div class="dx-virtual-cell" role="gridcell">Row 1</div>
      </div>
    </div>
    <div class="dx-virtual-spacer" style="--spacer-h: 9920px"></div>
  </div>
  Server-driven windowing: htmx loads the next slice on reveal; the spacer
  preserves scroll height for the full count.
-->

<div class="dx-virtual-grid" data-dx-virtual-grid role="grid" aria-label="Virtual grid" aria-rowcount="1000" tabindex="0">
  <div class="dx-virtual-header" role="row">
    <div class="dx-virtual-head-cell" role="columnheader">ID</div>
    <div class="dx-virtual-head-cell" role="columnheader">Name</div>
  </div>
  <div data-dx-virtual-rows>
    <div class="dx-virtual-row" role="row">
      <div class="dx-virtual-cell" role="gridcell">1</div>
      <div class="dx-virtual-cell" role="gridcell">Row 1</div>
    </div>
    <div class="dx-virtual-row" role="row">
      <div class="dx-virtual-cell" role="gridcell">2</div>
      <div class="dx-virtual-cell" role="gridcell">Row 2</div>
    </div>
  </div>
  <div class="dx-virtual-spacer"></div>
</div>
