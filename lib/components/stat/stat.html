<!--
  Stat — reference markup for server templates.
  Root: <div class="dx-stat">
  Parts:
    label  <div class="dx-stat-label">
    row    <div class="dx-stat-row">         (wraps value + delta)
    value  <div class="dx-stat-value">
    delta  <div class="dx-stat-delta dx-stat-delta--<tone>">
    hint   <div class="dx-stat-hint">
  Modifiers:
    delta tone --success | --danger | --neutral   (default: --neutral)
  The label slot is uppercased by CSS. Delta and hint render only when
  provided; delta always carries a tone class. No JS, no data-* hooks.
-->

<div class="dx-stat">
  <div class="dx-stat-label">Revenue</div>
  <div class="dx-stat-row">
    <div class="dx-stat-value">$48,120</div>
  </div>
</div>

<div class="dx-stat">
  <div class="dx-stat-label">Active users</div>
  <div class="dx-stat-row">
    <div class="dx-stat-value">12,431</div>
    <div class="dx-stat-delta dx-stat-delta--success">+8.2%</div>
  </div>
  <div class="dx-stat-hint">Compared to last month</div>
</div>

<div class="dx-stat">
  <div class="dx-stat-label">Error rate</div>
  <div class="dx-stat-row">
    <div class="dx-stat-value">0.7%</div>
    <div class="dx-stat-delta dx-stat-delta--danger">+0.3%</div>
  </div>
  <div class="dx-stat-hint">Above the 0.5% SLO</div>
</div>

<div class="dx-stat">
  <div class="dx-stat-label">Open issues</div>
  <div class="dx-stat-row">
    <div class="dx-stat-value">23</div>
    <div class="dx-stat-delta dx-stat-delta--neutral">unchanged</div>
  </div>
</div>
