<!--
  FabMenu — reference markup for server templates.
  Root: <div class="dx-fabmenu dx-fabmenu--<position>" data-dx-fabmenu
        [data-dx-position="bottom-right|bottom-left|top-right|top-left"]
        [data-dx-icon="+"]>
    <div role="menu" class="dx-fabmenu-menu" data-dx-fabmenu-menu
         aria-label="Open menu" [hidden]>
      <div class="dx-fabmenu-item-wrapper" data-dx-fabmenu-item-wrapper>
        <span class="dx-fabmenu-tooltip" aria-hidden="true">Label</span>
        <button type="button" role="menuitem" class="dx-fabmenu-item"
                data-dx-fabmenu-item data-dx-text="Label"
                [data-dx-value="val"] [data-dx-icon="icon"]
                [aria-label="Label"] [title="Label"]
                [aria-disabled="true"] [disabled] tabindex="0|-1">
          <span class="dx-fabmenu-item-icon" aria-hidden="true">icon</span>
        </button>
      </div>
      ... more items
    </div>
    <button type="button" class="dx-fabmenu-main"
            data-dx-fabmenu-trigger aria-haspopup="menu"
            aria-expanded="true|false" aria-controls="menu-id"
            aria-label="Open menu">
      <span class="dx-fabmenu-main-icon" aria-hidden="true">+</span>
    </button>
  </div>
  behaviors.js toggles aria-expanded and hidden on the main button/menu,
  handles outside click and Escape to close, Tab to move within items when
  open, and dispatches dx:fabmenu-click{ text, value } (and icon/path if
  present) on item activation. Disabled items are aria-disabled and not
  actionable. Position is via data-dx-position class modifier.
-->

<!-- Default bottom-right -->
<div class="dx-fabmenu dx-fabmenu--bottom-right" data-dx-fabmenu data-dx-position="bottom-right" aria-label="Open menu">
  <div role="menu" class="dx-fabmenu-menu" data-dx-fabmenu-menu aria-label="Open menu" hidden>
    <div class="dx-fabmenu-item-wrapper" data-dx-fabmenu-item-wrapper>
      <span class="dx-fabmenu-tooltip" aria-hidden="true">Create</span>
      <button type="button" role="menuitem" class="dx-fabmenu-item" data-dx-fabmenu-item data-dx-text="Create" data-dx-value="create" data-dx-icon="+" aria-label="Create" title="Create" tabindex="-1">
        <span class="dx-fabmenu-item-icon" aria-hidden="true">+</span>
      </button>
    </div>
    <div class="dx-fabmenu-item-wrapper" data-dx-fabmenu-item-wrapper>
      <span class="dx-fabmenu-tooltip" aria-hidden="true">Edit</span>
      <button type="button" role="menuitem" class="dx-fabmenu-item" data-dx-fabmenu-item data-dx-text="Edit" data-dx-value="edit" data-dx-icon="✎" aria-label="Edit" title="Edit" tabindex="-1">
        <span class="dx-fabmenu-item-icon" aria-hidden="true">✎</span>
      </button>
    </div>
    <div class="dx-fabmenu-item-wrapper" data-dx-fabmenu-item-wrapper>
      <span class="dx-fabmenu-tooltip" aria-hidden="true">Delete</span>
      <button type="button" role="menuitem" class="dx-fabmenu-item" data-dx-fabmenu-item data-dx-text="Delete" data-dx-value="delete" aria-label="Delete" title="Delete" tabindex="-1">
        <span class="dx-fabmenu-item-icon" aria-hidden="true">✕</span>
      </button>
    </div>
  </div>
  <button type="button" class="dx-fabmenu-main" data-dx-fabmenu-trigger aria-haspopup="menu" aria-expanded="false" aria-controls="fab-menu-1" aria-label="Open menu">
    <span class="dx-fabmenu-main-icon" aria-hidden="true">+</span>
  </button>
</div>

<!-- Open state bottom-left with disabled item -->
<div class="dx-fabmenu dx-fabmenu--bottom-left dx-fabmenu--open" data-dx-fabmenu data-dx-position="bottom-left">
  <div role="menu" class="dx-fabmenu-menu" data-dx-fabmenu-menu aria-label="Open menu">
    <div class="dx-fabmenu-item-wrapper" data-dx-fabmenu-item-wrapper>
      <span class="dx-fabmenu-tooltip" aria-hidden="true">Share</span>
      <button type="button" role="menuitem" class="dx-fabmenu-item" data-dx-fabmenu-item data-dx-text="Share" data-dx-value="share" aria-label="Share" title="Share" tabindex="0">
        <span class="dx-fabmenu-item-icon" aria-hidden="true">↗</span>
      </button>
    </div>
    <div class="dx-fabmenu-item-wrapper" data-dx-fabmenu-item-wrapper>
      <span class="dx-fabmenu-tooltip" aria-hidden="true">Export</span>
      <button type="button" role="menuitem" class="dx-fabmenu-item dx-fabmenu-item--disabled" data-dx-fabmenu-item data-dx-text="Export" data-dx-value="export" aria-label="Export" title="Export" aria-disabled="true" disabled tabindex="-1">
        <span class="dx-fabmenu-item-icon" aria-hidden="true">⤓</span>
      </button>
    </div>
  </div>
  <button type="button" class="dx-fabmenu-main" data-dx-fabmenu-trigger aria-haspopup="menu" aria-expanded="true" aria-controls="fab-menu-2" aria-label="Open menu">
    <span class="dx-fabmenu-main-icon dx-fabmenu-main-icon--open" aria-hidden="true">+</span>
  </button>
</div>

<!-- Top-right position with icons -->
<div class="dx-fabmenu dx-fabmenu--top-right" data-dx-fabmenu data-dx-position="top-right">
  <button type="button" class="dx-fabmenu-main" data-dx-fabmenu-trigger aria-haspopup="menu" aria-expanded="false" aria-controls="fab-menu-3" aria-label="Quick actions">
    <span class="dx-fabmenu-main-icon" aria-hidden="true">⚡</span>
  </button>
  <div role="menu" class="dx-fabmenu-menu" data-dx-fabmenu-menu aria-label="Quick actions" hidden>
    <div class="dx-fabmenu-item-wrapper" data-dx-fabmenu-item-wrapper>
      <span class="dx-fabmenu-tooltip" aria-hidden="true">New file</span>
      <button type="button" role="menuitem" class="dx-fabmenu-item" data-dx-fabmenu-item data-dx-text="New file" data-dx-value="new-file" data-dx-icon="📄" aria-label="New file" title="New file" tabindex="-1">
        <span class="dx-fabmenu-item-icon" aria-hidden="true">📄</span>
      </button>
    </div>
    <div class="dx-fabmenu-item-wrapper" data-dx-fabmenu-item-wrapper>
      <span class="dx-fabmenu-tooltip" aria-hidden="true">Upload</span>
      <button type="button" role="menuitem" class="dx-fabmenu-item" data-dx-fabmenu-item data-dx-text="Upload" data-dx-value="upload" data-dx-icon="⤒" aria-label="Upload" title="Upload" tabindex="-1">
        <span class="dx-fabmenu-item-icon" aria-hidden="true">⤒</span>
      </button>
    </div>
  </div>
</div>
