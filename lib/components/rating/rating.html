<!--
  Rating — reference markup for server templates.
  Root: <div class="dt-rating" data-dt-rating role="radiogroup"
        aria-label="Rating" aria-readonly="false" [data-dt-stars="5"]
        [data-dt-value="3"] [data-dt-readonly] [data-dt-disabled]>
    [<button type="button" class="dt-rating-clear" data-dt-rating-clear
             aria-label="Clear rating" tabindex="0"><svg ban/></button>]
    <button type="button" class="dt-rating-item [dt-rating-item--filled]"
            role="radio" aria-checked="true|false" aria-posinset="1"
            aria-setsize="5" aria-label="1 star" tabindex="0|-1"
            data-dt-rating-item data-dt-rating-value="1">
      <svg class="dt-rating-icon--filled" width="20" height="20"
           viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
           focusable="false"><path d="..."/></svg>
      <svg class="dt-rating-icon--empty" width="20" height="20"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linejoin="round" aria-hidden="true"
           focusable="false"><path d="..."/></svg>
    </button>
    ... one per star (data-dt-rating-value 1..N)
  </div>
  behaviors.js syncs aria-checked, filled/outline icon visibility and the
  roving tabindex, sets the value on click or Arrow/Home/End keys and
  dispatches dt:change (detail.value = integer 0..N). data-dt-readonly
  and data-dt-disabled disable interaction.
-->
