<!--
  Badge — reference markup for server templates.
  Root: <span class="dx-badge dx-badge--<tone> dx-badge--<variant>">
  Modifiers:
    tone     --neutral | --primary | --success | --warning | --danger   (default: --neutral)
    variant  --soft | --solid | --outline                               (default: --soft)
  A server template composes the class string from the tone and variant
  props. Non-interactive span; must not wrap interactive controls.
-->

<span class="dx-badge dx-badge--neutral dx-badge--soft">Neutral</span>
<span class="dx-badge dx-badge--primary dx-badge--soft">Primary</span>
<span class="dx-badge dx-badge--success dx-badge--soft">Success</span>
<span class="dx-badge dx-badge--warning dx-badge--soft">Warning</span>
<span class="dx-badge dx-badge--danger dx-badge--soft">Danger</span>

<span class="dx-badge dx-badge--neutral dx-badge--solid">Solid</span>
<span class="dx-badge dx-badge--primary dx-badge--solid">Primary</span>
<span class="dx-badge dx-badge--success dx-badge--solid">Success</span>
<span class="dx-badge dx-badge--warning dx-badge--solid">Warning</span>
<span class="dx-badge dx-badge--danger dx-badge--solid">Danger</span>

<span class="dx-badge dx-badge--neutral dx-badge--outline">Outline</span>
<span class="dx-badge dx-badge--primary dx-badge--outline">Primary</span>
<span class="dx-badge dx-badge--success dx-badge--outline">Success</span>
<span class="dx-badge dx-badge--warning dx-badge--outline">Warning</span>
<span class="dx-badge dx-badge--danger dx-badge--outline">Danger</span>
