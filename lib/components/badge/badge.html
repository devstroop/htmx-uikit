<!--
  Badge — reference markup for server templates.
  Root: <span class="se-badge se-badge--<tone> se-badge--<variant>">
  Modifiers:
    tone     --neutral | --primary | --success | --warning | --danger   (default: --neutral)
    variant  --soft | --solid | --outline                               (default: --soft)
  A server template composes the class string from the tone and variant
  props. Non-interactive span; must not wrap interactive controls.
-->

<span class="se-badge se-badge--neutral se-badge--soft">Neutral</span>
<span class="se-badge se-badge--primary se-badge--soft">Primary</span>
<span class="se-badge se-badge--success se-badge--soft">Success</span>
<span class="se-badge se-badge--warning se-badge--soft">Warning</span>
<span class="se-badge se-badge--danger se-badge--soft">Danger</span>

<span class="se-badge se-badge--neutral se-badge--solid">Solid</span>
<span class="se-badge se-badge--primary se-badge--solid">Primary</span>
<span class="se-badge se-badge--success se-badge--solid">Success</span>
<span class="se-badge se-badge--warning se-badge--solid">Warning</span>
<span class="se-badge se-badge--danger se-badge--solid">Danger</span>

<span class="se-badge se-badge--neutral se-badge--outline">Outline</span>
<span class="se-badge se-badge--primary se-badge--outline">Primary</span>
<span class="se-badge se-badge--success se-badge--outline">Success</span>
<span class="se-badge se-badge--warning se-badge--outline">Warning</span>
<span class="se-badge se-badge--danger se-badge--outline">Danger</span>
