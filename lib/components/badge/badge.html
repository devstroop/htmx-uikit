<!--
  Badge — reference markup for server templates.
  Root: <span class="dt-badge dt-badge--<tone> dt-badge--<variant>">
  Modifiers:
    tone     --neutral | --primary | --success | --warning | --danger   (default: --neutral)
    variant  --soft | --solid | --outline                               (default: --soft)
  A server template composes the class string from the tone and variant
  props. Non-interactive span; must not wrap interactive controls.
-->

<span class="dt-badge dt-badge--neutral dt-badge--soft">Neutral</span>
<span class="dt-badge dt-badge--primary dt-badge--soft">Primary</span>
<span class="dt-badge dt-badge--success dt-badge--soft">Success</span>
<span class="dt-badge dt-badge--warning dt-badge--soft">Warning</span>
<span class="dt-badge dt-badge--danger dt-badge--soft">Danger</span>

<span class="dt-badge dt-badge--neutral dt-badge--solid">Solid</span>
<span class="dt-badge dt-badge--primary dt-badge--solid">Primary</span>
<span class="dt-badge dt-badge--success dt-badge--solid">Success</span>
<span class="dt-badge dt-badge--warning dt-badge--solid">Warning</span>
<span class="dt-badge dt-badge--danger dt-badge--solid">Danger</span>

<span class="dt-badge dt-badge--neutral dt-badge--outline">Outline</span>
<span class="dt-badge dt-badge--primary dt-badge--outline">Primary</span>
<span class="dt-badge dt-badge--success dt-badge--outline">Success</span>
<span class="dt-badge dt-badge--warning dt-badge--outline">Warning</span>
<span class="dt-badge dt-badge--danger dt-badge--outline">Danger</span>
