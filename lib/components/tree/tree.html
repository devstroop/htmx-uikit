<!--
  Tree — reference markup for server templates.
  Root: <div class="dx-tree" data-dx-tree [data-dx-selection-mode="single|multiple"]
        aria-label="Tree" role="tree" aria-multiselectable="false|true">
    <div class="dx-tree-children" role="group" data-dx-tree-children>
      <div class="dx-tree-item" role="treeitem" data-dx-tree-item
           data-dx-key="id" data-dx-text="Label" [data-dx-disabled]
           aria-level="1" aria-setsize="3" aria-posinset="1"
           [aria-expanded="true|false"] [aria-selected="true|false"]
           [aria-busy="true"] tabindex="0|-1">
        <button type="button" class="dx-tree-caret" data-dx-tree-caret
                aria-label="Expand Label" aria-expanded="true|false"
                [hidden] when leaf>▸</button>
        <span class="dx-tree-label">Label</span>
        [<div class="dx-tree-children" role="group" data-dx-tree-children>
           ... nested items
         </div> when expanded]
      </div>
      ... more items
    </div>
  </div>
  behaviors.js handles expand/collapse via caret clicks, keyboard
  (ArrowUp/Down, ArrowRight expand or go to child, ArrowLeft collapse or go to parent,
   Home/End, Enter/Space toggle selection, typeahead), lazy children via
  data-dx-load-child-data (hx-get), and dispatches dx:tree-select{key,text,selected},
  dx:tree-expand{key}, dx:tree-collapse{key}.
-->

<!-- Default single selection -->
<div class="dx-tree" data-dx-tree data-dx-selection-mode="single" role="tree" aria-label="Tree" aria-multiselectable="false">
  <div class="dx-tree-children" role="group" data-dx-tree-children>
    <div class="dx-tree-item" role="treeitem" data-dx-tree-item data-dx-key="1" data-dx-text="Documents" aria-level="1" aria-setsize="2" aria-posinset="1" aria-expanded="true" aria-selected="false" tabindex="0">
      <button type="button" class="dx-tree-caret" data-dx-tree-caret aria-label="Collapse Documents" aria-expanded="true">▾</button>
      <span class="dx-tree-label">Documents</span>
      <div class="dx-tree-children" role="group" data-dx-tree-children>
        <div class="dx-tree-item" role="treeitem" data-dx-tree-item data-dx-key="1-1" data-dx-text="Resume.pdf" aria-level="2" aria-setsize="2" aria-posinset="1" aria-selected="false" tabindex="-1">
          <span class="dx-tree-label">Resume.pdf</span>
        </div>
        <div class="dx-tree-item" role="treeitem" data-dx-tree-item data-dx-key="1-2" data-dx-text="Cover.pdf" aria-level="2" aria-setsize="2" aria-posinset="2" aria-selected="true" tabindex="-1">
          <span class="dx-tree-label">Cover.pdf</span>
        </div>
      </div>
    </div>
    <div class="dx-tree-item" role="treeitem" data-dx-tree-item data-dx-key="2" data-dx-text="Pictures" aria-level="1" aria-setsize="2" aria-posinset="2" aria-expanded="false" aria-selected="false" tabindex="-1">
      <button type="button" class="dx-tree-caret" data-dx-tree-caret aria-label="Expand Pictures" aria-expanded="false">▸</button>
      <span class="dx-tree-label">Pictures</span>
    </div>
  </div>
</div>

<!-- Lazy loading -->
<div class="dx-tree" data-dx-tree data-dx-load-child-data="/api/tree/children" role="tree" aria-label="Lazy tree">
  <div class="dx-tree-children" role="group" data-dx-tree-children>
    <div class="dx-tree-item" role="treeitem" data-dx-tree-item data-dx-key="root" data-dx-text="Root" aria-level="1" aria-expanded="false" tabindex="0">
      <button type="button" class="dx-tree-caret" data-dx-tree-caret aria-label="Expand Root" aria-expanded="false">▸</button>
      <span class="dx-tree-label">Root</span>
    </div>
  </div>
</div>
