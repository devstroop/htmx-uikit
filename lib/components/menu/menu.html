<!--
  Menu — reference markup for server templates.
  Root: <nav class="dx-menu [dx-menu--vertical]" data-dx-menu
        [data-dx-orientation="horizontal|vertical"] aria-label="Menu">
    <div class="dx-menu-menubar" role="menubar" aria-label="Menu"
         data-dx-menu-menubar>
      <div class="dx-menu-item-wrapper" data-dx-menu-item-wrapper>
        <button type="button" class="dx-menu-item" role="menuitem"
                data-dx-menu-item data-dx-text="Home" data-dx-value="home"
                [data-dx-path="/"] data-top="true" data-index="0"
                [aria-haspopup="menu"] [aria-expanded="true|false"]
                [aria-controls="submenu-id"] [aria-disabled="true"]
                [aria-current="page"] [disabled] tabindex="0|-1">
          [<span class="dx-menu-icon" aria-hidden="true">icon</span>]
          <span class="dx-menu-text">Label</span>
          [<span class="dx-menu-caret" aria-hidden="true">▾</span>]
        </button>
        [<div id="submenu-id" role="menu" class="dx-menu-submenu"
              data-dx-menu-submenu aria-label="Parent label" [hidden]>
           <button type="button" role="menuitem" class="dx-menu-submenu-item"
                   data-dx-menu-item data-dx-text="Child" data-dx-value="child"
                   [data-dx-path="/child"] [aria-disabled="true"] [disabled]
                   tabindex="0|-1">...</button>
         </div>]
      </div>
      ... more wrappers
    </div>
  </nav>
  behaviors.js toggles submenu open state (aria-expanded/hidden), handles
  hover (horizontal) and click, keyboard (ArrowLeft/Right, ArrowDown to
  open, ArrowUp/Down within submenu, Enter/Space activate, Escape closes,
  Home/End) and dispatches dx:menu-click{ text, value, path } on leaf
  activation. Disabled items have aria-disabled and are not focusable or
  actionable. Active link uses aria-current="page".
-->

<!-- Default horizontal menu -->
<nav class="dx-menu" data-dx-menu aria-label="Menu">
  <div class="dx-menu-menubar" role="menubar" aria-label="Menu" data-dx-menu-menubar>
    <div class="dx-menu-item-wrapper" data-dx-menu-item-wrapper>
      <button type="button" class="dx-menu-item" role="menuitem" data-dx-menu-item data-dx-text="Home" data-dx-value="home" data-dx-path="/" data-top="true" data-index="0" tabindex="0">
        <span class="dx-menu-text">Home</span>
      </button>
    </div>
    <div class="dx-menu-item-wrapper" data-dx-menu-item-wrapper>
      <button type="button" class="dx-menu-item" role="menuitem" data-dx-menu-item data-dx-text="Products" data-top="true" data-index="1" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-submenu-1" tabindex="0">
        <span class="dx-menu-text">Products</span>
        <span class="dx-menu-caret" aria-hidden="true">▾</span>
      </button>
      <div id="menu-submenu-1" role="menu" class="dx-menu-submenu" data-dx-menu-submenu aria-label="Products" hidden>
        <button type="button" role="menuitem" class="dx-menu-submenu-item" data-dx-menu-item data-dx-text="Laptops" data-dx-value="laptops" data-dx-path="/products/laptops" tabindex="-1">Laptops</button>
        <button type="button" role="menuitem" class="dx-menu-submenu-item" data-dx-menu-item data-dx-text="Phones" data-dx-value="phones" data-dx-path="/products/phones" tabindex="-1">Phones</button>
        <button type="button" role="menuitem" class="dx-menu-submenu-item" data-dx-menu-item data-dx-text="Accessories" data-dx-value="accessories" tabindex="-1">Accessories</button>
      </div>
    </div>
    <div class="dx-menu-item-wrapper" data-dx-menu-item-wrapper>
      <button type="button" class="dx-menu-item" role="menuitem" data-dx-menu-item data-dx-text="About" data-dx-value="about" data-dx-path="/about" data-top="true" data-index="2" tabindex="0">
        <span class="dx-menu-text">About</span>
      </button>
    </div>
  </div>
</nav>

        <span class="dx-menu-icon" aria-hidden="true">▦</span>
        <span class="dx-menu-text">Dashboard</span>

    </div>
    <div class="dx-menu-item-wrapper" data-dx-menu-item-wrapper>
      <button type="button" class="dx-menu-item" role="menuitem" data-dx-menu-item data-dx-text="Reports" data-top="true" data-index="1" aria-haspopup="menu" aria-expanded="false" aria-controls="menu2-submenu-1" tabindex="0">
        <span class="dx-menu-icon" aria-hidden="true">📊</span>
        <span class="dx-menu-text">Reports</span>

<!-- Vertical orientation with active state -->
<nav class="dx-menu dx-menu--vertical" data-dx-menu data-dx-orientation="vertical" aria-label="Sidebar menu">

    <div class="dx-menu-item-wrapper" data-dx-menu-item-wrapper>
      <button type="button" class="dx-menu-item" role="menuitem" data-dx-menu-item data-dx-text="Overview" data-dx-value="overview" data-top="true" data-index="0" aria-current="page" tabindex="0">
        <span class="dx-menu-text">Overview</span>
      </button>
    </div>
    <div class="dx-menu-item-wrapper" data-dx-menu-item-wrapper>
      <button type="button" class="dx-menu-item" role="menuitem" data-dx-menu-item data-dx-text="Projects" data-top="true" data-index="1" aria-haspopup="menu" aria-expanded="false" aria-controls="menu3-submenu-1" tabindex="0">
        <span class="dx-menu-text">Projects</span>
        <span class="dx-menu-caret" aria-hidden="true">▾</span>
      </button>
      <div id="menu3-submenu-1" role="menu" class="dx-menu-submenu" data-dx-menu-submenu aria-label="Projects" hidden>
        <button type="button" role="menuitem" class="dx-menu-submenu-item" data-dx-menu-item data-dx-text="Active" data-dx-value="active" data-dx-path="/projects/active" tabindex="-1">Active</button>
        <button type="button" role="menuitem" class="dx-menu-submenu-item" data-dx-menu-item data-dx-text="Archived" data-dx-value="archived" tabindex="-1">Archived</button>

    <div class="dx-menu-item-wrapper" data-dx-menu-item-wrapper>

</nav>
