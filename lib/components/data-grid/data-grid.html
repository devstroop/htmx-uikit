<div class="dx-datagrid" data-dx-datagrid
     data-dx-datagrid-properties='[
       {"property":"name","title":"Name","type":"string","frozen":true,"width":"8rem"},
       {"property":"age","title":"Age","type":"number","align":"center"},
       {"property":"role","title":"Role","type":"string"},
       {"property":"active","title":"Active","type":"boolean","align":"center"}
     ]'
     data-dx-datagrid-sortable
     data-dx-datagrid-multisort
     data-dx-datagrid-filterable
     data-dx-datagrid-select="multiple"
     data-dx-datagrid-column-picker
     data-dx-datagrid-resize
     data-dx-datagrid-reorder
     data-dx-datagrid-groupable
     data-dx-datagrid-edit
     data-dx-datagrid-delete
     data-dx-datagrid-create
     data-dx-datagrid-pagesize="3"
     data-dx-datagrid-pagesize-options="[3,5,10]"
     data-dx-datagrid-pagenumbers="5"
     aria-label="People">
  <div class="dx-datagrid-toolbar" data-dx-datagrid-toolbar></div>
  <div class="dx-datagrid-data" data-dx-datagrid-data>
    <table class="dx-datagrid-table" role="grid" aria-rowcount="5" aria-label="People">
      <colgroup data-dx-datagrid-cols></colgroup>
      <thead data-dx-datagrid-head></thead>
      <tbody data-dx-datagrid-rows>
        <tr data-dx-row data-dx-row-key="1" data-dx-row-value='{"name":"John","age":30,"role":"admin","active":true}'>
          <td data-dx-col="name">John</td>
          <td data-dx-col="age" class="dx-datagrid-cell--center">30</td>
          <td data-dx-col="role">admin</td>
          <td data-dx-col="active" class="dx-datagrid-cell--center">Yes</td>
        </tr>
        <tr data-dx-row data-dx-row-key="2" data-dx-row-value='{"name":"Jane","age":25,"role":"editor","active":false}'>
          <td data-dx-col="name">Jane</td>
          <td data-dx-col="age" class="dx-datagrid-cell--center">25</td>
          <td data-dx-col="role">editor</td>
          <td data-dx-col="active" class="dx-datagrid-cell--center">No</td>
        </tr>
        <tr data-dx-row data-dx-row-key="3" data-dx-row-value='{"name":"Bob","age":40,"role":"viewer","active":true}'>
          <td data-dx-col="name">Bob</td>
          <td data-dx-col="age" class="dx-datagrid-cell--center">40</td>
          <td data-dx-col="role">viewer</td>
          <td data-dx-col="active" class="dx-datagrid-cell--center">Yes</td>
        </tr>
        <tr data-dx-row data-dx-row-key="4" data-dx-row-value='{"name":"Alice","age":22,"role":"editor","active":true}'>
          <td data-dx-col="name">Alice</td>
          <td data-dx-col="age" class="dx-datagrid-cell--center">22</td>
          <td data-dx-col="role">editor</td>
          <td data-dx-col="active" class="dx-datagrid-cell--center">Yes</td>
        </tr>
        <tr data-dx-row data-dx-row-key="5" data-dx-row-value='{"name":"Charlie","age":35,"role":"viewer","active":false}'>
          <td data-dx-col="name">Charlie</td>
          <td data-dx-col="age" class="dx-datagrid-cell--center">35</td>
          <td data-dx-col="role">viewer</td>
          <td data-dx-col="active" class="dx-datagrid-cell--center">No</td>
        </tr>
      </tbody>
    </table>
    <div class="dx-datagrid-empty" data-dx-datagrid-empty hidden>No records found</div>
    <div class="dx-datagrid-loading" data-dx-datagrid-loading hidden role="status">Loading…</div>
  </div>
  <div class="dx-datagrid-pager" data-dx-datagrid-pager></div>
</div>
