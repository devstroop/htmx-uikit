<!--
  Textbox — reference markup for server templates.
  Root: <input class="dt-textbox dt-textbox--<size>" type="text">
  Modifiers:
    size    --xs | --sm | --md | --lg | --xl      (default: --md)
    state   --invalid            (danger border + ring; pair with aria-invalid="true")
  Attributes are forwarded to the native input (name, value, placeholder,
  disabled, aria-*). Default type is "text" (a different type may be
  passed). :focus-visible draws the focus ring; disabled renders at
  opacity 0.55.
-->

<input class="dt-textbox dt-textbox--md" type="text" placeholder="Full name" />
<input class="dt-textbox dt-textbox--sm" type="text" placeholder="Small textbox" />
<input class="dt-textbox dt-textbox--lg" type="text" placeholder="Large textbox" />
<input class="dt-textbox dt-textbox--md" type="text" value="Prefilled" />
<input class="dt-textbox dt-textbox--md" type="text" placeholder="Disabled" disabled />
<input class="dt-textbox dt-textbox--md dt-textbox--invalid" type="text" aria-invalid="true" />
