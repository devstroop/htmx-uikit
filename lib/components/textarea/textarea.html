<!--
  Textarea — reference markup for server templates.
  Root: <textarea class="se-textarea se-textarea--<size> se-textarea--resize-<mode>">
  Modifiers:
    size   --sm (56px) | --md (84px) | --lg (128px)   (default: --md)
    resize --none | --vertical | --horizontal | --both (default: --none)
  All native textarea attributes are forwarded (rows, placeholder, disabled,
  aria-*, required). :focus-visible draws the focus ring.
-->

<textarea class="se-textarea se-textarea--md se-textarea--resize-none" placeholder="Placeholder"></textarea>
<textarea class="se-textarea se-textarea--sm se-textarea--resize-none" placeholder="Small"></textarea>
<textarea class="se-textarea se-textarea--lg se-textarea--resize-vertical">Large, resizable vertically</textarea>
<textarea class="se-textarea se-textarea--md se-textarea--resize-both" rows="4" disabled>Disabled</textarea>
