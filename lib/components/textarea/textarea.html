<!--
  Textarea — reference markup for server templates.
  Root: <textarea class="dx-textarea dx-textarea--<size> dx-textarea--resize-<mode>">
  Modifiers:
    size   --sm (56px) | --md (84px) | --lg (128px)   (default: --md)
    resize --none | --vertical | --horizontal | --both (default: --none)
  All native textarea attributes are forwarded (rows, placeholder, disabled,
  aria-*, required). :focus-visible draws the focus ring.
-->

<textarea class="dx-textarea dx-textarea--md dx-textarea--resize-none" placeholder="Placeholder"></textarea>
<textarea class="dx-textarea dx-textarea--sm dx-textarea--resize-none" placeholder="Small"></textarea>
<textarea class="dx-textarea dx-textarea--lg dx-textarea--resize-vertical">Large, resizable vertically</textarea>
<textarea class="dx-textarea dx-textarea--md dx-textarea--resize-both" rows="4" disabled>Disabled</textarea>
