<!--
  Steps — reference markup for server templates.
  Root: <nav class="dx-steps" data-dx-steps [data-dx-linear]
        [data-dx-selected-index="0"] aria-label="Steps">
    <ol class="dx-steps-list" role="list" data-dx-steps-list>
      <li role="listitem" class="dx-steps-item">
        [<span class="dx-steps-connector" aria-hidden="true"></span>  when index>0]
        <button type="button" class="dx-steps-step [dx-steps-step--active]
                [dx-steps-step--completed] [dx-steps-step--disabled]"
                data-dx-steps-item data-dx-index="0" data-dx-text="Label"
                [data-dx-icon="icon"] [aria-current="step"]
                [aria-disabled="true"] [disabled] tabindex="0|-1">
          <span class="dx-steps-circle" aria-hidden="true">
            <span class="dx-steps-check" aria-hidden="true">✓</span>  when completed
            or <span class="dx-steps-icon" aria-hidden="true">icon</span>
            or <span class="dx-steps-number" aria-hidden="true">1</span>
          </span>
          <span class="dx-steps-text">Label</span>
        </button>
      </li>
      ... more items
    </ol>
    [<div class="dx-steps-panels" data-dx-steps-panels>
       <div class="dx-steps-panel" role="tabpanel"
            data-dx-steps-panel data-dx-index="0" [hidden]>content</div>
     </div>]
  </nav>
  behaviors.js toggles active/completed/disabled classes, aria-current="step",
  aria-disabled/disabled + tabindex, injects the completed check icon,
  respects data-dx-linear (only completed + next clickable), moves focus with
  ArrowLeft/Right, Home/End, and dispatches dx:steps-change{ index } on
  activation. Content panels (data-dx-steps-panel) are shown/hidden to match
  the active index. Disabled steps are not focusable or actionable.
-->

<!-- Default 3-step wizard, first step active -->
<nav class="dx-steps" data-dx-steps data-dx-selected-index="0" aria-label="Steps">
  <ol class="dx-steps-list" role="list" data-dx-steps-list>
    <li role="listitem" class="dx-steps-item">
      <button type="button" class="dx-steps-step dx-steps-step--active" data-dx-steps-item data-dx-index="0" data-dx-text="Details" aria-current="step" tabindex="0">
        <span class="dx-steps-circle" aria-hidden="true">
          <span class="dx-steps-number">1</span>
        </span>
        <span class="dx-steps-text">Details</span>
      </button>
    </li>
    <li role="listitem" class="dx-steps-item">
      <span class="dx-steps-connector" aria-hidden="true"></span>
      <button type="button" class="dx-steps-step" data-dx-steps-item data-dx-index="1" data-dx-text="Payment" tabindex="0">
        <span class="dx-steps-circle" aria-hidden="true">
          <span class="dx-steps-number">2</span>
        </span>
        <span class="dx-steps-text">Payment</span>
      </button>
    </li>
    <li role="listitem" class="dx-steps-item">
      <span class="dx-steps-connector" aria-hidden="true"></span>
      <button type="button" class="dx-steps-step" data-dx-steps-item data-dx-index="2" data-dx-text="Confirm" tabindex="0">
        <span class="dx-steps-circle" aria-hidden="true">
          <span class="dx-steps-number">3</span>
        </span>
        <span class="dx-steps-text">Confirm</span>
      </button>
    </li>
  </ol>
  <div class="dx-steps-panels" data-dx-steps-panels>
    <div class="dx-steps-panel" role="tabpanel" data-dx-steps-panel data-dx-index="0">Details content</div>
    <div class="dx-steps-panel" role="tabpanel" data-dx-steps-panel data-dx-index="1" hidden>Payment content</div>
    <div class="dx-steps-panel" role="tabpanel" data-dx-steps-panel data-dx-index="2" hidden>Confirm content</div>
  </div>
</nav>

<!-- Linear wizard with icons, 2nd step active, 3rd blocked by linear -->
<nav class="dx-steps" data-dx-steps data-dx-linear data-dx-selected-index="1" aria-label="Checkout steps">
  <ol class="dx-steps-list" role="list" data-dx-steps-list>
    <li role="listitem" class="dx-steps-item">
      <button type="button" class="dx-steps-step dx-steps-step--completed" data-dx-steps-item data-dx-index="0" data-dx-text="Cart" data-dx-icon="🛒" tabindex="0">
        <span class="dx-steps-circle" aria-hidden="true">
          <span class="dx-steps-check" aria-hidden="true">✓</span>
        </span>
        <span class="dx-steps-text">Cart</span>
      </button>
    </li>
    <li role="listitem" class="dx-steps-item">
      <span class="dx-steps-connector dx-steps-connector--completed" aria-hidden="true"></span>
      <button type="button" class="dx-steps-step dx-steps-step--active" data-dx-steps-item data-dx-index="1" data-dx-text="Shipping" data-dx-icon="🚚" aria-current="step" tabindex="0">
        <span class="dx-steps-circle" aria-hidden="true">
          <span class="dx-steps-icon" aria-hidden="true">🚚</span>
        </span>
        <span class="dx-steps-text">Shipping</span>
      </button>
    </li>
    <li role="listitem" class="dx-steps-item">
      <span class="dx-steps-connector" aria-hidden="true"></span>
      <button type="button" class="dx-steps-step dx-steps-step--disabled" data-dx-steps-item data-dx-index="2" data-dx-text="Review" aria-disabled="true" disabled tabindex="-1">
        <span class="dx-steps-circle" aria-hidden="true">
          <span class="dx-steps-number">3</span>
        </span>
        <span class="dx-steps-text">Review</span>
      </button>
    </li>
  </ol>
  <div class="dx-steps-panels" data-dx-steps-panels>
    <div class="dx-steps-panel" role="tabpanel" data-dx-steps-panel data-dx-index="0" hidden>Cart content</div>
    <div class="dx-steps-panel" role="tabpanel" data-dx-steps-panel data-dx-index="1">Shipping content</div>
    <div class="dx-steps-panel" role="tabpanel" data-dx-steps-panel data-dx-index="2" hidden>Review content</div>
  </div>
</nav>

<!-- With icons, disabled middle step, non-linear (completed check on first) -->
<nav class="dx-steps" data-dx-steps data-dx-selected-index="2" aria-label="Onboarding">
  <ol class="dx-steps-list" role="list" data-dx-steps-list>
    <li role="listitem" class="dx-steps-item">
      <button type="button" class="dx-steps-step dx-steps-step--completed" data-dx-steps-item data-dx-index="0" data-dx-text="Profile" data-dx-icon="👤" tabindex="0">
        <span class="dx-steps-circle" aria-hidden="true">
          <span class="dx-steps-check" aria-hidden="true">✓</span>
        </span>
        <span class="dx-steps-text">Profile</span>
      </button>
    </li>
    <li role="listitem" class="dx-steps-item">
      <span class="dx-steps-connector dx-steps-connector--completed" aria-hidden="true"></span>
      <button type="button" class="dx-steps-step dx-steps-step--disabled" data-dx-steps-item data-dx-index="1" data-dx-text="Team" data-dx-icon="👥" aria-disabled="true" disabled tabindex="-1">
        <span class="dx-steps-circle" aria-hidden="true">
          <span class="dx-steps-icon" aria-hidden="true">👥</span>
        </span>
        <span class="dx-steps-text">Team</span>
      </button>
    </li>
    <li role="listitem" class="dx-steps-item">
      <span class="dx-steps-connector" aria-hidden="true"></span>
      <button type="button" class="dx-steps-step dx-steps-step--active" data-dx-steps-item data-dx-index="2" data-dx-text="Billing" data-dx-icon="💳" aria-current="step" tabindex="0">
        <span class="dx-steps-circle" aria-hidden="true">
          <span class="dx-steps-icon" aria-hidden="true">💳</span>
        </span>
        <span class="dx-steps-text">Billing</span>
      </button>
    </li>
    <li role="listitem" class="dx-steps-item">
      <span class="dx-steps-connector" aria-hidden="true"></span>
      <button type="button" class="dx-steps-step" data-dx-steps-item data-dx-index="3" data-dx-text="Launch" tabindex="0">
        <span class="dx-steps-circle" aria-hidden="true">
          <span class="dx-steps-number">4</span>
        </span>
        <span class="dx-steps-text">Launch</span>
      </button>
    </li>
  </ol>
  <div class="dx-steps-panels" data-dx-steps-panels>
    <div class="dx-steps-panel" role="tabpanel" data-dx-steps-panel data-dx-index="0" hidden>Profile content</div>
    <div class="dx-steps-panel" role="tabpanel" data-dx-steps-panel data-dx-index="1" hidden>Team content (disabled)</div>
    <div class="dx-steps-panel" role="tabpanel" data-dx-steps-panel data-dx-index="2">Billing content</div>
    <div class="dx-steps-panel" role="tabpanel" data-dx-steps-panel data-dx-index="3" hidden>Launch content</div>
  </div>
</nav>
