<!--
  Column — reference markup for server templates.
  Root: <div class="se-column [se-column--<size>] [se-column--offset-<n>]
               [se-column--<tier>-<size>] [se-column--<tier>-offset-<n>]">
  size/offset: 1..12 / 0..11 in columns of a 12-column grid.
  tiers: sm (>= 576px) | md (>= 768px) | lg (>= 992px) | xl (>= 1200px).
  No size class: flex: 1 (fills remaining space).
  No JS, no data-* hooks.
-->

<div class="se-row">
  <div class="se-column se-column--12" style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">12</div>
</div>

<div class="se-row">
  <div class="se-column se-column--6" style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">6</div>
  <div class="se-column se-column--6" style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">6</div>
</div>

<div class="se-row">
  <div class="se-column se-column--4" style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">4</div>
  <div class="se-column se-column--4" style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">4</div>
  <div class="se-column se-column--4" style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">4</div>
</div>

<div class="se-row">
  <div class="se-column se-column--12 se-column--md-6 se-column--lg-3" style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">12 / md-6 / lg-3</div>
  <div class="se-column se-column--12 se-column--md-6 se-column--lg-3" style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">12 / md-6 / lg-3</div>
  <div class="se-column se-column--12 se-column--md-6 se-column--lg-3" style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">12 / md-6 / lg-3</div>
  <div class="se-column se-column--12 se-column--md-6 se-column--lg-3" style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">12 / md-6 / lg-3</div>
</div>

<div class="se-row">
  <div class="se-column se-column--4 se-column--offset-4" style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">4 + offset-4</div>
</div>
