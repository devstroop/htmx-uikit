<!--
  Button — reference markup for server templates.
  Root: <button class="se-button se-button--<variant>">
  Modifiers:
    variant  --primary | --secondary | --ghost | --danger | --success | --info   (default: --primary)
    size     --xs | --sm | --lg                            (default: md)
    shape    --icon-only (circular; the button MUST carry an aria-label)
    state    --full-width | disabled attribute
  A server template composes the class string; a loading state adds
  --loading plus aria-busy="true".
-->

<button class="se-button se-button--primary" type="button">Primary</button>
<button class="se-button se-button--secondary" type="button">Secondary</button>
<button class="se-button se-button--ghost" type="button">Ghost</button>
<button class="se-button se-button--danger" type="button">Danger</button>
<button class="se-button se-button--success" type="button">Success</button>
<button class="se-button se-button--info" type="button">Info</button>
<button class="se-button se-button--primary se-button--sm" type="button">Small</button>
<button class="se-button se-button--primary se-button--lg" type="button">Large</button>
<button class="se-button se-button--primary se-button--xs" type="button">Extra small</button>
<button class="se-button se-button--primary se-button--icon-only" type="button" aria-label="Add item">+</button>
<button class="se-button se-button--secondary se-button--sm se-button--icon-only" type="button" aria-label="Settings">⚙</button>
<button class="se-button se-button--primary" type="button" disabled>Disabled</button>
<button class="se-button se-button--primary se-button--full-width" type="button">Full width</button>
<button class="se-button se-button--primary se-button--loading" type="button" aria-busy="true">Saving…</button>
