<!--
  Password — reference markup for server templates.
  Root: <div class="dx-password" data-dx-password> wrapping
    <input class="dx-password-input dx-password-input--<size>" type="password"
           data-dx-password-input ...>
    <button class="dx-password-toggle" type="button" data-dx-password-toggle
            aria-pressed="false" aria-label="Show password"
            [data-dx-password-show="Show password"] [data-dx-password-hide="Hide password"]>
      <svg data-dx-password-icon="visible" ...>eye</svg>
      <svg data-dx-password-icon="hidden" hidden ...>eye-off</svg>
    </button>
  Modifiers (on the input): size --xs..--xl (default --md), state --invalid.
  data-dx-password-toggle (behaviors.js) flips the input between
  text/password, mirrors aria-pressed + aria-label and swaps the icon;
  data-dx-password-show/hide override the toggle labels.
-->

<div class="dx-password" data-dx-password>
  <input class="dx-password-input dx-password-input--md" type="password" data-dx-password-input placeholder="Password" />
  <button class="dx-password-toggle" type="button" data-dx-password-toggle aria-pressed="false" aria-label="Show password">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-dx-password-icon="visible">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
      <circle cx="12" cy="12" r="3" />
    </svg>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-dx-password-icon="hidden" hidden>
      <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24" />
      <path d="M1 1l22 22" />
    </svg>
  </button>
</div>

<div class="dx-password" data-dx-password>
  <input class="dx-password-input dx-password-input--sm" type="password" data-dx-password-input value="secret" />
  <button class="dx-password-toggle" type="button" data-dx-password-toggle aria-pressed="false" aria-label="Show password" data-dx-password-show="Reveal" data-dx-password-hide="Conceal">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-dx-password-icon="visible">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
      <circle cx="12" cy="12" r="3" />
    </svg>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-dx-password-icon="hidden" hidden>
      <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24" />
      <path d="M1 1l22 22" />
    </svg>
  </button>
</div>

<div class="dx-password" data-dx-password>
