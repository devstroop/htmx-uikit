<!--
  Tooltip — reference markup for server templates.
  Root: <span class="dx-tooltip" data-dx-tooltip [data-dx-delay-ms="300"]>
  Trigger: the first child element (any element — button, link, …)
  Bubble: <span class="dx-tooltip-bubble dx-tooltip-bubble--<placement>"
           role="tooltip" id="<id>" data-dx-tooltip-content hidden>
    placement  --top (default) | --right | --bottom | --left
  behaviors.js shows the bubble on hover/focus (delay), hides on
  leave/blur/Escape, and wires aria-describedby on the trigger while open.
-->

<span class="dx-tooltip" data-dx-tooltip data-dx-delay-ms="300">
  <button class="dx-button dx-button--secondary" type="button">Hover me</button>
  <span class="dx-tooltip-bubble dx-tooltip-bubble--top" role="tooltip" id="tt1" data-dx-tooltip-content hidden>
    More information
    <span class="dx-tooltip-arrow" aria-hidden="true"></span>
  </span>
</span>

<span class="dx-tooltip" data-dx-tooltip data-dx-delay-ms="0">
  <button class="dx-button dx-button--ghost" type="button">Zero delay</button>
  <span class="dx-tooltip-bubble dx-tooltip-bubble--right" role="tooltip" id="tt2" data-dx-tooltip-content hidden>
    Right placement
    <span class="dx-tooltip-arrow" aria-hidden="true"></span>
  </span>
</span>

<span class="dx-tooltip" data-dx-tooltip>
  <a href="#docs">Learn more</a>
  <span class="dx-tooltip-bubble dx-tooltip-bubble--bottom" role="tooltip" id="tt3" data-dx-tooltip-content hidden>
    Bottom placement
    <span class="dx-tooltip-arrow" aria-hidden="true"></span>
  </span>
</span>
