<!--
  Avatar — reference markup for server templates.
  Root: <span class="dt-avatar dt-avatar--<size> [dt-avatar--<status>]"
        role="img" aria-label="<name>">
  Modifiers:
    size     --sm (28px) | --md (36px) | --lg (48px)   (default: --md)
    status   --online | --offline | --away             (omitted when absent)
    palette  --palette-0..--palette-5                  (hash of the name,
             selects one of the six per-mode palette tokens)
  Parts:
    initials  <span class="dt-avatar-initials" aria-hidden="true">
    image     <img class="dt-avatar-image">
    status    <span class="dt-avatar-status" aria-hidden="true">
  The server template derives the initials (first letters of up to the
  first two whitespace-separated words, uppercased; "?" when no name) and
  the palette index (the react hash: h = (h*31 + c) >>> 0 over the name,
  then h % 6). The palette resolves per-mode via --dt-color-palette-0..5
  tokens (see scripts/derive-tone-tokens.mjs).
-->

<span class="dt-avatar dt-avatar--md dt-avatar--palette-1" role="img" aria-label="Jane Doe">
  <span class="dt-avatar-initials" aria-hidden="true">JD</span>
</span>

<span class="dt-avatar dt-avatar--sm dt-avatar--palette-3" role="img" aria-label="Alfred Aku">
  <span class="dt-avatar-initials" aria-hidden="true">AA</span>
  <span class="dt-avatar-status" aria-hidden="true"></span>
</span>

<span class="dt-avatar dt-avatar--md dt-avatar--online dt-avatar--palette-0" role="img" aria-label="Ada Lovelace">
  <span class="dt-avatar-initials" aria-hidden="true">AL</span>
  <span class="dt-avatar-status" aria-hidden="true"></span>
</span>

<span class="dt-avatar dt-avatar--md dt-avatar--offline dt-avatar--palette-4" role="img" aria-label="Grace Hopper">
  <span class="dt-avatar-initials" aria-hidden="true">GH</span>
  <span class="dt-avatar-status" aria-hidden="true"></span>
</span>

<span class="dt-avatar dt-avatar--lg dt-avatar--away dt-avatar--palette-5" role="img" aria-label="Katherine Johnson">
  <span class="dt-avatar-initials" aria-hidden="true">KJ</span>
  <span class="dt-avatar-status" aria-hidden="true"></span>
</span>

<span class="dt-avatar dt-avatar--lg dt-avatar--palette-2" role="img" aria-label="No Name">
  <span class="dt-avatar-initials" aria-hidden="true">?</span>
</span>

<span class="dt-avatar dt-avatar--lg" role="img" aria-label="Jane Doe">
  <img class="dt-avatar-image" src="https://example.com/jane.jpg" alt="Jane Doe" />
</span>
