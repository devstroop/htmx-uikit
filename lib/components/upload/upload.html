<!--
  Upload — reference markup for server templates.
  Root: <div class="dx-upload" data-dx-upload
        [data-dx-upload-url="/api/files"] [data-dx-upload-param="files"]
        [data-dx-upload-auto="true"] [data-dx-upload-multiple]
        [data-dx-upload-accept="image/*"] [data-dx-upload-headers='{"X-Token":"…"}']>
    <button class="dx-upload-trigger" type="button" data-dx-upload-trigger>Upload</button>
    <input class="dx-upload-input" type="file" hidden
           data-dx-upload-input [multiple] [accept="…"]>
    <ul class="dx-upload-list" data-dx-upload-list>
      <li class="dx-upload-row" data-dx-upload-row data-dx-upload-state="pending">
        <span class="dx-upload-name">report.pdf</span>
        <span class="dx-upload-size">12 KB</span>
        <span class="dx-upload-progress"><span class="dx-upload-progress-fill"></span></span>
        <span class="dx-upload-status" role="status"></span>
        <button class="dx-upload-remove" type="button" data-dx-upload-remove aria-label="Remove report.pdf">×</button>
      </li>
    </ul>
  behaviors.js wires the trigger/input, queues rows, and XHR-uploads with
  progress; dispatches dx:upload-progress / dx:upload-complete /
  dx:upload-error on the root.
-->

<div class="dx-upload" data-dx-upload data-dx-upload-url="/api/files" data-dx-upload-param="files" data-dx-upload-auto="true" data-dx-upload-multiple>
  <button class="dx-upload-trigger" type="button" data-dx-upload-trigger>Upload files</button>
  <input class="dx-upload-input" type="file" hidden data-dx-upload-input multiple />
  <ul class="dx-upload-list" data-dx-upload-list></ul>
</div>

<div class="dx-upload" data-dx-upload data-dx-upload-url="/api/files" data-dx-upload-param="files" data-dx-upload-auto="false">
  <button class="dx-upload-trigger" type="button" data-dx-upload-trigger>Choose file</button>
  <input class="dx-upload-input" type="file" hidden data-dx-upload-input />
  <ul class="dx-upload-list" data-dx-upload-list></ul>
</div>

<div class="dx-upload" data-dx-upload data-dx-upload-url="/api/files" data-dx-upload-param="files" data-dx-upload-auto="true" data-dx-upload-accept="image/*">
  <button class="dx-upload-trigger" type="button" data-dx-upload-trigger>Upload image</button>
  <input class="dx-upload-input" type="file" hidden data-dx-upload-input accept="image/*" />
  <ul class="dx-upload-list" data-dx-upload-list></ul>
</div>
