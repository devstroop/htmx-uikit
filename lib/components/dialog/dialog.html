<!--
  Dialog — reference markup for server templates.
  Dialog: <dialog class="dt-dialog dt-dialog--<size>" data-dt-dialog>
    size  --sm | --md (default) | --lg
  Trigger: any element with data-dt-dialog-open="#<dialog-id>"
    (behaviors.js calls showModal and restores focus on close)
  Close: <button class="dt-dialog-close" type="button"
         data-dt-dialog-close aria-label="Close dialog">×</button>
  The native <dialog> provides focus containment, Escape, and the
  ::backdrop; the footer's buttons should close with data-dt-dialog-close.
-->

<button class="dt-button dt-button--primary" type="button" data-dt-dialog-open="#dialog1">
  Open dialog
</button>

<dialog class="dt-dialog dt-dialog--md" data-dt-dialog id="dialog1">
  <div class="dt-dialog-header">
    <div>
      <h2 class="dt-dialog-title">Confirm deletion</h2>
      <p class="dt-dialog-description">This cannot be undone.</p>
    </div>
    <button class="dt-dialog-close" type="button" data-dt-dialog-close aria-label="Close dialog">
      ×
    </button>
  </div>
  <div class="dt-dialog-body">
    <p>The workspace and all of its branches will be removed.</p>
  </div>
  <div class="dt-dialog-footer">
    <button class="dt-button dt-button--secondary" type="button" data-dt-dialog-close>
      Cancel
    </button>
    <button class="dt-button dt-button--danger" type="button" data-dt-dialog-close>
      Delete
    </button>
  </div>
</dialog>

<button class="dt-button dt-button--secondary" type="button" data-dt-dialog-open="#dialog2">
  Small dialog
</button>

<dialog class="dt-dialog dt-dialog--sm" data-dt-dialog id="dialog2">
  <div class="dt-dialog-header">
    <div>
      <h2 class="dt-dialog-title">Sync complete</h2>
    </div>
    <button class="dt-dialog-close" type="button" data-dt-dialog-close aria-label="Close dialog">
      ×
    </button>
  </div>
  <div class="dt-dialog-body">
    <p>All tokens are in sync.</p>
  </div>
  <div class="dt-dialog-footer">
    <button class="dt-button dt-button--primary" type="button" data-dt-dialog-close>
      Done
    </button>
  </div>
</dialog>
