<!--
  EmptyState — reference markup for server templates.
  Root: <div class="se-empty-state">
  Parts:
    icon        <div class="se-empty-state-icon">
    title       <div class="se-empty-state-title">
    description <div class="se-empty-state-description">
    action      <div class="se-empty-state-action">
  Slots render in fixed order (icon, title, description, action) and only
  when non-null. No variants, no JS, no data-* hooks.
-->

<div class="se-empty-state">
  <div class="se-empty-state-icon">
    <svg class="se-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
      <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" />
    </svg>
  </div>
  <div class="se-empty-state-title">No invoices yet</div>
  <div class="se-empty-state-description">Invoices will appear here once you create your first one.</div>
  <div class="se-empty-state-action">
    <button class="se-button se-button--primary" type="button">Create invoice</button>
  </div>
</div>

<div class="se-empty-state">
  <div class="se-empty-state-title">Nothing here</div>
</div>

<div class="se-empty-state">
  <div class="se-empty-state-icon">
    <svg class="se-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" />
    </svg>
  </div>
  <div class="se-empty-state-title">No files shared</div>
  <div class="se-empty-state-description">Share a file or folder with this team to get started.</div>
</div>
