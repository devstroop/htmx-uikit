<!--
  Numeric — reference markup for server templates.
  Root: <div class="dx-numeric" data-dx-numeric
        [data-dx-min="0"] [data-dx-max="10"] [data-dx-step="1"]>
    <input class="dx-numeric-input dx-numeric-input--<size>" type="text"
           inputmode="decimal" data-dx-numeric-input [value="3"]>
    <button class="dx-numeric-btn dx-numeric-btn--up" type="button"
            data-dx-numeric-up aria-label="Increment"><svg chevron-up/></button>
    <button class="dx-numeric-btn dx-numeric-btn--down" type="button"
            data-dx-numeric-down aria-label="Decrement"><svg chevron-down/></button>
  behaviors.js steps on click / ArrowUp / ArrowDown (clamped to
  data-dx-min/max, snapped to data-dx-step), strips non-numeric typing and
  clamps/snaps on blur. Modifiers: size --xs..--xl (default --md), state
  --invalid on the input.
-->

<div class="dx-numeric" data-dx-numeric data-dx-min="0" data-dx-max="100" data-dx-step="1">
  <input class="dx-numeric-input dx-numeric-input--md" type="text" inputmode="decimal" data-dx-numeric-input value="3" aria-label="Quantity" />
  <button class="dx-numeric-btn dx-numeric-btn--up" type="button" data-dx-numeric-up aria-label="Increment">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 15l-6-6-6 6" /></svg>
  </button>
  <button class="dx-numeric-btn dx-numeric-btn--down" type="button" data-dx-numeric-down aria-label="Decrement">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6" /></svg>
  </button>
</div>

<div class="dx-numeric" data-dx-numeric data-dx-min="0" data-dx-step="5">
  <input class="dx-numeric-input dx-numeric-input--sm" type="text" inputmode="decimal" data-dx-numeric-input value="0" aria-label="Rating (0-5)" />
  <button class="dx-numeric-btn dx-numeric-btn--up" type="button" data-dx-numeric-up aria-label="Increment">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 15l-6-6-6 6" /></svg>
  </button>
  <button class="dx-numeric-btn dx-numeric-btn--down" type="button" data-dx-numeric-down aria-label="Decrement">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6" /></svg>
  </button>
</div>

<div class="dx-numeric" data-dx-numeric>
  <input class="dx-numeric-input dx-numeric-input--md dx-numeric-input--invalid" type="text" inputmode="decimal" data-dx-numeric-input aria-invalid="true" placeholder="Invalid" />
  <button class="dx-numeric-btn dx-numeric-btn--up" type="button" data-dx-numeric-up aria-label="Increment">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 15l-6-6-6 6" /></svg>
  </button>
  <button class="dx-numeric-btn dx-numeric-btn--down" type="button" data-dx-numeric-down aria-label="Decrement">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6" /></svg>
  </button>
</div>

<div class="dx-numeric" data-dx-numeric data-dx-min="0" data-dx-max="9">
  <input class="dx-numeric-input dx-numeric-input--md" type="text" inputmode="decimal" data-dx-numeric-input value="2" aria-label="Disabled" disabled />
  <button class="dx-numeric-btn dx-numeric-btn--up" type="button" data-dx-numeric-up aria-label="Increment" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 15l-6-6-6 6" /></svg>
  </button>
  <button class="dx-numeric-btn dx-numeric-btn--down" type="button" data-dx-numeric-down aria-label="Decrement" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6" /></svg>
  </button>
</div>
