<!--
  Layout — application shell composition (Radzen RadzenLayout model).
  Root: <div class="dx-layout">
  Inside, in any authoring order:
    .dx-header                    top bar (use <header> for the landmark)
    .dx-layout-row                required wrapper for the middle band:
      .dx-sidebar [--left|--right] [--collapsed]   use <aside>
      .dx-body                                    use <main>
    .dx-footer                    bottom bar (use <footer>)
  All regions are optional; the row holds sidebars + body only.
  Collapse: [data-dx-sidebar-toggle="#id"] flips --collapsed on the
  sidebar and mirrors aria-expanded on the trigger.
  Width: var(--dx-layout-sidebar-width, 240px) — override inline or per
  theme. Height default 100vh; override inline (e.g. embedded shells).
-->

<div class="dx-layout" style="min-height: 480px; border: 1px solid currentColor; border-radius: 8px; overflow: hidden">
  <header class="dx-header">
    <span style="font-weight: 600">App title</span>
  </header>
  <div class="dx-layout-row">
    <aside class="dx-sidebar dx-sidebar--left" id="preview-sidebar" data-dx-sidebar>
      <nav aria-label="Preview navigation">
        <ul class="dx-list" style="display: grid; gap: 4px">
          <li>Dashboard</li>
          <li>Users</li>
          <li>Settings</li>
        </ul>
      </nav>
    </aside>
    <main class="dx-body">Page content goes here.</main>
  </div>
  <footer class="dx-footer">© 2026 Example</footer>
</div>
