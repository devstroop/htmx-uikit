<!--
  Togglebutton — reference markup for server templates.
  Root: <button type="button" class="dx-togglebutton dx-togglebutton--<size>"
        aria-pressed="false" data-dx-togglebutton>
  Modifiers:
    size    --sm | --md | --lg     (default: --md)
    state   --pressed              (aria-pressed="true"; always ship aria-pressed,
                                    it must start as "false" when unpressed)
            --full-width
  Behavior: [data-dx-togglebutton] toggles aria-pressed on click and flips
  the --pressed class; a disabled button stays put.
  Accessible name via text content or aria-label.
-->

<button type="button" class="dx-togglebutton dx-togglebutton--md" aria-pressed="false" data-dx-togglebutton>
  Bold
</button>

<button
  type="button"
  class="dx-togglebutton dx-togglebutton--md dx-togglebutton--pressed"
  aria-pressed="true"
  data-dx-togglebutton
>
  Italic
</button>

<button type="button" class="dx-togglebutton dx-togglebutton--sm" aria-pressed="false" data-dx-togglebutton>
  Small
</button>

<button type="button" class="dx-togglebutton dx-togglebutton--lg" aria-pressed="false" data-dx-togglebutton>
  Large
</button>

<button type="button" class="dx-togglebutton dx-togglebutton--md" aria-pressed="false" disabled data-dx-togglebutton>
  Disabled
</button>

<button type="button" class="dx-togglebutton dx-togglebutton--md dx-togglebutton--full-width" aria-pressed="false" data-dx-togglebutton>
  Full width
</button>
