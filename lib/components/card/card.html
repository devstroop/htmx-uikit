<!--
  Card — reference markup for server templates.
  Root: <div class="dx-card dx-card--<variant>" [tabindex="0" when interactive]>
  Modifiers:
    variant  --elevated (default) | --outlined | --interactive | --text
  Parts:
    header  <div class="dx-card-header">   (omitted when absent)
    body    <div class="dx-card-body">      (always present, wraps children)
    footer  <div class="dx-card-footer">    (omitted when absent)
  The interactive variant adds tabindex="0" and data-dx-interactive, which
  makes Enter/Space dispatch a click on the card (behaviors.js). A
  consumer wires the click action itself (e.g. hx-get or a link).
  Focus-visible ring handled in CSS.
-->

<div class="dx-card dx-card--elevated">
  <div class="dx-card-header">Deployments</div>
  <div class="dx-card-body">Your deployments are all healthy.</div>
  <div class="dx-card-footer">
    <button class="dx-button dx-button--secondary" type="button">View all</button>
  </div>
</div>

<div class="dx-card dx-card--elevated">
  <div class="dx-card-body">Body only.</div>
</div>

<div class="dx-card dx-card--outlined">
  <div class="dx-card-header">Usage</div>
  <div class="dx-card-body">This month: 48 GB of 100 GB.</div>
</div>

<div class="dx-card dx-card--interactive" tabindex="0" data-dx-interactive>
  <div class="dx-card-header">Open pull requests</div>
  <div class="dx-card-body">3 PRs await your review.</div>
</div>

<div class="dx-card dx-card--interactive" tabindex="0" data-dx-interactive>
  <div class="dx-card-body">Interactive body only.</div>
</div>

<div class="dx-card dx-card--text">
  <div class="dx-card-header">Flat text card</div>
  <div class="dx-card-body">No border, no shadow, transparent background — inherits the parent surface.</div>
</div>

<div class="dx-card dx-card--outlined">
  <div class="dx-card-body">Body.</div>
  <div class="dx-card-footer">Footer only.</div>
</div>
