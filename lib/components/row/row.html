<!--
  Row — reference markup for server templates.
  Root: <div class="dt-row [dt-row--<mod>]">
  Modifiers:
    align     --center | --end | --baseline | --stretch (default: stretch)
    justify   --justify-center | --justify-end | --justify-between |
               --justify-around | --justify-evenly
    wrap      --no-wrap (default: wrap)
  Gutter defaults to space.4; override inline: style="gap: <value>".
  No JS, no data-* hooks.
-->

<div class="dt-row">
  <div style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">auto</div>
  <div style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">auto</div>
</div>

<div class="dt-row dt-row--justify-between">
  <div style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">between</div>
  <div style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">between</div>
</div>

<div class="dt-row dt-row--center">
  <div style="padding: 12px 16px; border: 1px solid currentColor; border-radius: 8px">centered</div>
</div>
