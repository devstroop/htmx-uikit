<!--
  Carousel — reference markup for server templates.
  Root: <div class="dx-carousel" data-dx-carousel
        [data-dx-selected-index="0"] [data-dx-auto]
        [data-dx-interval="3000"] [data-dx-pause-on-hover="true"]
        [data-dx-show-arrows="true|false"] [data-dx-show-indicators="true|false"]
        role="region" aria-roledescription="carousel" aria-label="Carousel"
        tabindex="0">
    <div class="dx-carousel-viewport" data-dx-carousel-viewport
         id="carousel-viewport">
      <div class="dx-carousel-slide [dx-carousel-slide--active]"
           role="group" aria-roledescription="slide"
           aria-label="Slide 1 of 3" data-dx-carousel-item
           data-dx-index="0" [hidden]>slide content</div>
      ... more slides
    </div>
    [<button type="button" class="dx-carousel-arrow dx-carousel-prev"
            data-dx-carousel-prev aria-label="Previous slide"
            aria-controls="carousel-viewport">‹</button>
     <button type="button" class="dx-carousel-arrow dx-carousel-next"
            data-dx-carousel-next aria-label="Next slide"
            aria-controls="carousel-viewport">›</button>]  when showArrows
    [<button type="button" class="dx-carousel-pause"
            data-dx-carousel-pause aria-pressed="true|false"
            aria-label="Pause|Resume">⏸|▶</button>]  when auto
    [<div class="dx-carousel-indicators" role="group"
         aria-label="Slide indicators" data-dx-carousel-indicators>
       <button type="button" class="dx-carousel-indicator
               [dx-carousel-indicator--active]"
               data-dx-carousel-indicator data-dx-index="0"
               aria-label="Go to slide 1" aria-current="true|false"
               aria-controls="carousel-viewport"></button>
       ... more indicators
     </div>]  when showIndicators
  </div>
  behaviors.js manages active slide, arrows/indicators, pause control,
  keyboard (ArrowLeft/Right, Home/End), auto-play with interval and
  pauseOnHover (mouseenter/leave + focusin/out), dispatches
  dx:carousel-change{ index } on change, toggles aria-hidden/hidden and
  aria-current on indicators, and ensures focus ring via outline-primary.
-->

<!-- Default manual carousel, 3 slides, arrows + indicators -->
<div class="dx-carousel" data-dx-carousel data-dx-selected-index="0" role="region" aria-roledescription="carousel" aria-label="Carousel" tabindex="0">
  <div class="dx-carousel-viewport" data-dx-carousel-viewport id="carousel1-viewport">
    <div class="dx-carousel-slide dx-carousel-slide--active" role="group" aria-roledescription="slide" aria-label="Slide 1 of 3" data-dx-carousel-item data-dx-index="0">
      <img src="https://via.placeholder.com/600x250?text=Slide+1" alt="Slide 1" style="width: 100%; display: block" />
      <p>First slide description</p>
    </div>
    <div class="dx-carousel-slide" role="group" aria-roledescription="slide" aria-label="Slide 2 of 3" data-dx-carousel-item data-dx-index="1" aria-hidden="true" hidden>
      <img src="https://via.placeholder.com/600x250?text=Slide+2" alt="Slide 2" style="width: 100%; display: block" />
      <p>Second slide description</p>
    </div>
    <div class="dx-carousel-slide" role="group" aria-roledescription="slide" aria-label="Slide 3 of 3" data-dx-carousel-item data-dx-index="2" aria-hidden="true" hidden>
      <img src="https://via.placeholder.com/600x250?text=Slide+3" alt="Slide 3" style="width: 100%; display: block" />
      <p>Third slide description</p>
    </div>
  </div>
  <button type="button" class="dx-carousel-arrow dx-carousel-prev" data-dx-carousel-prev aria-label="Previous slide" aria-controls="carousel1-viewport">‹</button>
  <button type="button" class="dx-carousel-arrow dx-carousel-next" data-dx-carousel-next aria-label="Next slide" aria-controls="carousel1-viewport">›</button>
  <div class="dx-carousel-indicators" role="group" aria-label="Slide indicators" data-dx-carousel-indicators>
    <button type="button" class="dx-carousel-indicator dx-carousel-indicator--active" data-dx-carousel-indicator data-dx-index="0" aria-label="Go to slide 1" aria-current="true" aria-controls="carousel1-viewport"></button>
    <button type="button" class="dx-carousel-indicator" data-dx-carousel-indicator data-dx-index="1" aria-label="Go to slide 2" aria-controls="carousel1-viewport"></button>
    <button type="button" class="dx-carousel-indicator" data-dx-carousel-indicator data-dx-index="2" aria-label="Go to slide 3" aria-controls="carousel1-viewport"></button>
  </div>
</div>

<!-- Auto-play carousel with pauseOnHover and pause button -->
<div class="dx-carousel" data-dx-carousel data-dx-auto data-dx-interval="3000" data-dx-pause-on-hover="true" data-dx-selected-index="0" role="region" aria-roledescription="carousel" aria-label="Featured" tabindex="0">
  <div class="dx-carousel-viewport" data-dx-carousel-viewport id="carousel2-viewport">
    <div class="dx-carousel-slide dx-carousel-slide--active" role="group" aria-roledescription="slide" aria-label="Slide 1 of 3" data-dx-carousel-item data-dx-index="0">
      <div style="height: 180px; background: var(--dx-color-surface-hover); display: flex; align-items: center; justify-content: center">Auto slide 1</div>
    </div>
    <div class="dx-carousel-slide" role="group" aria-roledescription="slide" aria-label="Slide 2 of 3" data-dx-carousel-item data-dx-index="1" aria-hidden="true" hidden>
      <div style="height: 180px; background: var(--dx-color-surface-hover); display: flex; align-items: center; justify-content: center">Auto slide 2</div>
    </div>
    <div class="dx-carousel-slide" role="group" aria-roledescription="slide" aria-label="Slide 3 of 3" data-dx-carousel-item data-dx-index="2" aria-hidden="true" hidden>
      <div style="height: 180px; background: var(--dx-color-surface-hover); display: flex; align-items: center; justify-content: center">Auto slide 3</div>
    </div>
  </div>
  <button type="button" class="dx-carousel-arrow dx-carousel-prev" data-dx-carousel-prev aria-label="Previous slide" aria-controls="carousel2-viewport">‹</button>
  <button type="button" class="dx-carousel-arrow dx-carousel-next" data-dx-carousel-next aria-label="Next slide" aria-controls="carousel2-viewport">›</button>
  <button type="button" class="dx-carousel-pause" data-dx-carousel-pause aria-pressed="false" aria-label="Pause">⏸</button>
  <div class="dx-carousel-indicators" role="group" aria-label="Slide indicators" data-dx-carousel-indicators>
    <button type="button" class="dx-carousel-indicator dx-carousel-indicator--active" data-dx-carousel-indicator data-dx-index="0" aria-label="Go to slide 1" aria-current="true" aria-controls="carousel2-viewport"></button>
    <button type="button" class="dx-carousel-indicator" data-dx-carousel-indicator data-dx-index="1" aria-label="Go to slide 2" aria-controls="carousel2-viewport"></button>
    <button type="button" class="dx-carousel-indicator" data-dx-carousel-indicator data-dx-index="2" aria-label="Go to slide 3" aria-controls="carousel2-viewport"></button>
  </div>
</div>

<!-- No arrows, indicators only -->
<div class="dx-carousel" data-dx-carousel data-dx-show-arrows="false" data-dx-selected-index="1" role="region" aria-roledescription="carousel" aria-label="Gallery" tabindex="0">
  <div class="dx-carousel-viewport" data-dx-carousel-viewport id="carousel3-viewport">
    <div class="dx-carousel-slide" role="group" aria-roledescription="slide" aria-label="Slide 1 of 2" data-dx-carousel-item data-dx-index="0" aria-hidden="true" hidden>
      <div style="height: 140px; background: var(--dx-color-surface-hover); display: flex; align-items: center; justify-content: center">Gallery 1</div>
    </div>
    <div class="dx-carousel-slide dx-carousel-slide--active" role="group" aria-roledescription="slide" aria-label="Slide 2 of 2" data-dx-carousel-item data-dx-index="1">
      <div style="height: 140px; background: var(--dx-color-surface-hover); display: flex; align-items: center; justify-content: center">Gallery 2 (active)</div>
    </div>
  </div>
  <div class="dx-carousel-indicators" role="group" aria-label="Slide indicators" data-dx-carousel-indicators>
    <button type="button" class="dx-carousel-indicator" data-dx-carousel-indicator data-dx-index="0" aria-label="Go to slide 1" aria-controls="carousel3-viewport"></button>
    <button type="button" class="dx-carousel-indicator dx-carousel-indicator--active" data-dx-carousel-indicator data-dx-index="1" aria-label="Go to slide 2" aria-current="true" aria-controls="carousel3-viewport"></button>
  </div>
</div>

<!-- No indicators, arrows only, vertical content -->
<div class="dx-carousel" data-dx-carousel data-dx-show-indicators="false" data-dx-selected-index="0" role="region" aria-roledescription="carousel" aria-label="Testimonials" tabindex="0">
  <div class="dx-carousel-viewport" data-dx-carousel-viewport id="carousel4-viewport">
    <div class="dx-carousel-slide dx-carousel-slide--active" role="group" aria-roledescription="slide" aria-label="Slide 1 of 2" data-dx-carousel-item data-dx-index="0">
      <blockquote>"Great product!" — Alice</blockquote>
    </div>
    <div class="dx-carousel-slide" role="group" aria-roledescription="slide" aria-label="Slide 2 of 2" data-dx-carousel-item data-dx-index="1" aria-hidden="true" hidden>
      <blockquote>"Highly recommend." — Bob</blockquote>
    </div>
  </div>
  <button type="button" class="dx-carousel-arrow dx-carousel-prev" data-dx-carousel-prev aria-label="Previous slide" aria-controls="carousel4-viewport">‹</button>
  <button type="button" class="dx-carousel-arrow dx-carousel-next" data-dx-carousel-next aria-label="Next slide" aria-controls="carousel4-viewport">›</button>
</div>
