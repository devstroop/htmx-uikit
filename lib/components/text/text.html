<!--
  Text — text presentation primitives (Radzen TextStyle parity).
  Root: <h1 class="dx-text dx-text--display-1">
  Variants:
    display-1..6  -> h1..h6   fluid clamp() scale with negative letter-spacing
    body-1        -> p        0.875rem / 1.429
    body-2        -> p        0.875rem / 1.5
    caption       -> span     0.75rem / 1.429 + muted color
    overline      -> span     uppercase, 0.08em tracking, medium weight
  No JS, no data-* hooks — pure presentation.
-->

<h1 class="dx-text dx-text--display-1 dx-mb-4">Display 1</h1>
<h2 class="dx-text dx-text--display-2 dx-mb-4">Display 2</h2>
<h3 class="dx-text dx-text--display-3 dx-mb-4">Display 3</h3>
<h4 class="dx-text dx-text--display-4 dx-mb-4">Display 4</h4>
<h5 class="dx-text dx-text--display-5 dx-mb-4">Display 5</h5>
<h6 class="dx-text dx-text--display-6 dx-mb-4">Display 6</h6>

<p class="dx-text dx-text--body-1 dx-mb-4">Body 1 — the default text style.</p>
<p class="dx-text dx-text--body-2 dx-mb-4">Body 2 — relaxed leading for reading.</p>

<span class="dx-text dx-text--caption">Caption — muted metadata</span>
<span class="dx-text dx-text--overline">Overline — section label</span>
