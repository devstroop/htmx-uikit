<!--
  Timespanpicker — reference markup for server templates.
  Root: <div class="dx-timespanpicker" data-dx-timespanpicker
        [data-dx-format="d.HH:mm:ss"] [data-dx-min="PT1H"]
        [data-dx-max="P10DT12H"] [data-dx-precision="second"]
        [data-dx-show-days] [data-dx-show-hours] [data-dx-show-minutes]
        [data-dx-show-seconds] [data-dx-inline]>
    <input class="dx-timespanpicker-input dx-timespanpicker-input--<size>"
           type="text" data-dx-timespanpicker-input [value="1.02:30:00"]
           [aria-label="Duration"]>
    <button class="dx-timespanpicker-trigger" type="button"
            data-dx-timespanpicker-trigger aria-haspopup="dialog"
            aria-expanded="false" aria-controls="<popup-id>"
            aria-label="Set duration"><svg clock/></button>
    [<button class="dx-timespanpicker-clear" type="button"
             data-dx-timespanpicker-clear aria-label="Clear duration"><svg x/></button>]
    <div class="dx-timespanpicker-popup" id="<popup-id>" role="dialog"
         aria-label="Set duration" data-dx-timespanpicker-popup hidden>
      <div class="dx-timespanpicker-units">
        <div class="dx-timespanpicker-unit" data-dx-unit="days">  (omit per data-dx-show-*)
          <span class="dx-timespanpicker-unit-label">Days</span>
          <button type="button" class="dx-timespanpicker-step" data-dx-timespanpicker-step
                  data-dx-timespanpicker-step-unit="days" data-dx-timespanpicker-step-dir="1"
                  aria-label="Increase days"><svg chevron-up/></button>
          <input type="text" inputmode="numeric" class="dx-timespanpicker-value"
                 data-dx-timespanpicker-value data-dx-unit="days" aria-label="Days" />
          <button type="button" class="dx-timespanpicker-step" data-dx-timespanpicker-step
                  data-dx-timespanpicker-step-unit="days" data-dx-timespanpicker-step-dir="-1"
                  aria-label="Decrease days"><svg chevron-down/></button>
        </div>
        ... same for hours / minutes / seconds
      </div>
      <div class="dx-timespanpicker-footer" data-dx-timespanpicker-footer>
        <button type="button" class="dx-timespanpicker-ok" data-dx-timespanpicker-ok>OK</button>
      </div>
    </div>
  </div>
  Value is staged in the unit fields and committed on OK; closing without
  confirming (outside click / Escape / Tab) reverts the staged edits.
  Enter in the input toggles the popup; ArrowUp/Down and Home/End step a
  focused unit field. Commits fire dx:change (detail.value = ISO 8601
  duration, e.g. "P1DT2H30M"); failed typing fires dx:invalid.
  Formatting: "d.HH:mm:ss" (days) or "HH:mm:ss"; data-dx-precision rounds
  the committed value to day|hour|minute|second.
-->
