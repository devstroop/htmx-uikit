<!--
  Sidebar — collapsible flank (Radzen RadzenSidebar model).
  Root: <aside class="dx-sidebar [dx-sidebar--left|--right] [dx-sidebar--collapsed]" data-dx-sidebar>
  Position: --left (default, right border) or --right (left border).
  Width: var(--dx-layout-sidebar-width, 240px) — override inline or
  per theme.
  Collapse: author adds dx-sidebar--collapsed for the initial state;
  any element with data-dx-sidebar-toggle="#id" flips the class and
  mirrors aria-expanded on itself. Toggle should set aria-controls
  pointing at the sidebar id.
  Responsive: dx-sidebar--responsive collapses below 768px via media
  query (RadzenSidebar Responsive parity) — no JS.
  Overlay (drawer): dx-sidebar--overlay renders the aside absolutely
  over the body with shadow.lg; the owning .dx-layout-row becomes its
  positioning context via :has(). Pair it with a scrim:
    <div class="dx-layout-mask" data-dx-sidebar-mask="#side"></div>
  The data-dx-sidebar-mask behavior collapses the target sidebar,
  hides the mask, and mirrors aria-expanded="false" on its toggle.
  Collapse is visual-only: hide the aside (hidden/inert) as well if
  its content must not be reachable while collapsed.
-->

<aside class="dx-sidebar dx-sidebar--left" id="demos-sidebar" data-dx-sidebar>
  <nav aria-label="Demos navigation">
    <ul class="dx-list" style="display: grid; gap: 4px">
      <li>Dashboard</li>
      <li>Users</li>
      <li>Settings</li>
    </ul>
  </nav>
</aside>

<button class="dx-button dx-button--ghost dx-button--sm" type="button" data-dx-sidebar-toggle="#demos-sidebar" aria-expanded="true" aria-controls="demos-sidebar">
  Toggle sidebar
</button>

<!-- Responsive: collapses below 768px regardless of expanded state. -->
<aside class="dx-sidebar dx-sidebar--left dx-sidebar--responsive" id="responsive-sidebar" data-dx-sidebar>
  <nav aria-label="Responsive navigation">
    <ul class="dx-list" style="display: grid; gap: 4px">
      <li>Dashboard</li>
      <li>Users</li>
    </ul>
  </nav>
</aside>

<!-- Overlay drawer: absolute panel + scrim (mask closes the drawer;
     Escape closes it too). Start collapsed with the mask hidden so
     copying this markup does not cover the page. -->
<div class="dx-layout-row">
  <div class="dx-layout-mask dx-layout-mask--hidden" data-dx-sidebar-mask="#drawer-sidebar"></div>
  <aside class="dx-sidebar dx-sidebar--right dx-sidebar--overlay dx-sidebar--collapsed" id="drawer-sidebar" data-dx-sidebar>
    <nav aria-label="Drawer navigation">
      <ul class="dx-list" style="display: grid; gap: 4px">
        <li>Dashboard</li>
        <li>Settings</li>
      </ul>
    </nav>
  </aside>
</div>

<button class="dx-button dx-button--ghost dx-button--sm" type="button" data-dx-sidebar-toggle="#drawer-sidebar" aria-expanded="false" aria-controls="drawer-sidebar">
  Toggle drawer
</button>
