<!--
  Header — structural top bar (Radzen RadzenHeader model).
  Root: <header class="dt-header"> (or any element with the class).
  Content height is intrinsic; the shell adds surface background,
  bottom border and space.4 padding. No JS, no data-* hooks.
-->

<header class="dt-header">
  <span style="font-weight: 600">App title</span>
  <button class="dt-button dt-button--ghost dt-button--sm" type="button" data-dt-sidebar-toggle="#preview-sidebar" aria-expanded="true" aria-controls="preview-sidebar">
    Toggle sidebar
  </button>
</header>
