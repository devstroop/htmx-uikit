<!--
  Gauges — meter reference (react Gauges parity). Gauges are display-only:
  server-rendered SVG, no behavior, no JS. Reference blocks document the
  geometry contract; linear/radial gauges follow in later slices.
  Behavior tests: none (no behavior); the uikit spec asserts the markup
  contract via the component-dir files.
-->

<div class="dx-gauge" role="meter" aria-label="Speed" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">
  <svg viewBox="0 0 200 130" width="100%" aria-hidden="true">
    <path d="M 30 130 A 80 80 0 1 1 170 130" fill="none" stroke="var(--dx-color-border)" stroke-width="16" stroke-linecap="round"></path>
    <path d="M 30 130 A 80 80 0 0 1 150 60" fill="none" stroke="var(--dx-color-primary)" stroke-width="16" stroke-linecap="round"></path>
  </svg>
  <div class="dx-gauge-value">40</div>
</div>

<!-- Linear gauge: horizontal scale with range band, fill, pointer, ticks. -->
<div class="dx-gauge" role="meter" aria-label="Load" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">
  <svg width="280" height="68" viewBox="0 -24 280 76" aria-hidden="true">
    <rect x="58" y="-10" width="100" height="20" fill="#00ff00" opacity="0.35"></rect>
    <rect x="8" y="-10" width="264" height="20" rx="10" fill="none" stroke="var(--dx-color-border)" stroke-width="2"></rect>
    <rect x="8" y="-10" width="112.8" height="20" rx="10" fill="var(--dx-color-primary)"></rect>
    <path d="M 120.8 -20 L 115.8 -12 L 125.8 -12 Z" fill="var(--dx-color-primary)"></path>
    <line x1="8" y1="-6" x2="8" y2="0" stroke="var(--dx-color-border)" stroke-width="1.5"></line>
    <text x="8" y="-10" text-anchor="middle">0</text>
    <line x1="272" y1="-6" x2="272" y2="0" stroke="var(--dx-color-border)" stroke-width="1.5"></line>
    <text x="272" y="-10" text-anchor="middle">100</text>
  </svg>
  <div class="dx-gauge-value">40</div>
</div>

<!-- Radial gauge: circular scale with range band, needle, and label. -->
<div class="dx-gauge" role="meter" aria-label="Speed" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">
  <svg viewBox="0 0 200 200" width="100%" aria-hidden="true">
    <path d="M 100 22 A 78 78 0 1 1 99.99 22" fill="none" stroke="var(--dx-color-border)" stroke-width="12" stroke-linecap="round"></path>
    <path d="M 100 22 A 78 78 0 0 1 178 100" fill="none" stroke="#00ff00" stroke-width="12"></path>
    <line x1="100" y1="100" x2="100" y2="36" stroke="var(--dx-color-primary)" stroke-width="4" stroke-linecap="round"></line>
    <circle cx="100" cy="100" r="7" fill="var(--dx-color-primary)"></circle>
  </svg>
  <div class="dx-gauge-value">40</div>
</div>
