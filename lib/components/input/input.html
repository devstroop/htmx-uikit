<!--
  Input — reference markup for server templates.
  Root: <input class="dx-input dx-input--<size>">
  Modifiers:
    size    --sm | --md          (default: --md)
    state   --invalid            (sets danger border + ring; pair with aria-invalid="true")
  Attributes are forwarded to the native input (type, name, value,
  placeholder, disabled, aria-*). :focus-visible draws the focus ring;
  disabled renders at opacity 0.55.
-->

<input class="dx-input dx-input--md" type="text" placeholder="Placeholder" />
<input class="dx-input dx-input--sm" type="text" placeholder="Small input" />
<input class="dx-input dx-input--md" type="text" value="Prefilled" />
<input class="dx-input dx-input--md" type="text" placeholder="Disabled" disabled />
<input class="dx-input dx-input--md dx-input--invalid" type="text" aria-invalid="true" />
