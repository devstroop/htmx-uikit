<!--
  Scheduler — reference markup for server templates.
  Root: <div class="dx-scheduler" data-dx-scheduler [data-dx-view="week"] aria-label="Scheduler" role="group">
    <div class="dx-scheduler-header">
      <button class="dx-scheduler-nav" data-dx-scheduler-prev aria-label="Previous">‹</button>
      <span class="dx-scheduler-title">Jan 2024</span>
      <button class="dx-scheduler-nav" data-dx-scheduler-next aria-label="Next">›</button>
    </div>
    <div class="dx-scheduler-grid" role="presentation">
      <div class="dx-scheduler-timecol">
        <div class="dx-scheduler-time">8:00</div>
      </div>
      <div class="dx-scheduler-day" data-dx-scheduler-day tabindex="0">
        <div class="dx-scheduler-day-header">Mon Jan 15</div>
        <div class="dx-scheduler-slot" data-dx-scheduler-slot tabindex="-1"></div>
        <button class="dx-scheduler-event" data-dx-scheduler-event data-dx-id="1" aria-label="Meeting 10:00 - 11:00">Meeting</button>
      </div>
    </div>
  </div>
  behaviors.js handles prev/next, slot/event clicks, keyboard, and dispatches dx:scheduler-event-click, dx:scheduler-slot-click, dx:scheduler-date-change.
-->

<div class="dx-scheduler" data-dx-scheduler data-dx-view="week" role="group" aria-label="Scheduler">
  <div class="dx-scheduler-header">
    <button type="button" class="dx-scheduler-nav" data-dx-scheduler-prev aria-label="Previous">‹</button>
    <span class="dx-scheduler-title">Jan 15, 2024</span>
    <button type="button" class="dx-scheduler-nav" data-dx-scheduler-next aria-label="Next">›</button>
  </div>
  <div class="dx-scheduler-grid" role="presentation">
    <div class="dx-scheduler-timecol">
      <div class="dx-scheduler-time">8:00</div>
      <div class="dx-scheduler-time">9:00</div>
      <div class="dx-scheduler-time">10:00</div>
    </div>
    <div class="dx-scheduler-day" data-dx-scheduler-day tabindex="0">
      <div class="dx-scheduler-day-header">Mon Jan 15</div>
      <div class="dx-scheduler-slot" data-dx-scheduler-slot tabindex="-1"></div>
      <button type="button" class="dx-scheduler-event" data-dx-scheduler-event data-dx-id="1" aria-label="Meeting 10:00 - 11:00">Meeting</button>
    </div>
    <div class="dx-scheduler-day" data-dx-scheduler-day tabindex="0">
      <div class="dx-scheduler-day-header">Tue Jan 16</div>
      <div class="dx-scheduler-slot" data-dx-scheduler-slot tabindex="-1"></div>
    </div>
  </div>
</div>
