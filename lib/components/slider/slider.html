<!--
  Slider — reference markup for server templates.
  Root: <div class="dx-slider [dx-slider--vertical] [dx-slider--disabled]"
        data-dx-slider [data-dx-min="0"] [data-dx-max="100"]
        [data-dx-step="1"] [data-dx-orientation="horizontal|vertical"]
        [data-dx-range] [data-dx-value="40"]
        [data-dx-value-min="20"] [data-dx-value-max="80"]>
    <div class="dx-slider-track" data-dx-slider-track>
      <div class="dx-slider-range" data-dx-slider-range></div>
      <div class="dx-slider-handle" role="slider" aria-valuemin="0"
           aria-valuemax="100" aria-valuenow="40"
           aria-orientation="horizontal" aria-label="Value" tabindex="0"
           data-dx-slider-handle></div>
      [<div class="dx-slider-handle" role="slider" aria-valuemin="0"
           aria-valuemax="100" aria-valuenow="80" tabindex="-1"
           data-dx-slider-handle data-dx-slider-handle-max></div>]  (range mode)
    </div>
  </div>
  behaviors.js positions the handles and fills the range, snaps to
  data-dx-step, drives pointer drag (setPointerCapture) and keyboard
  (Arrows ±step, Home/End, roving tabindex) and dispatches dx:change
  (detail.value = number, or {min, max} in range mode). No input box.
-->

<div class="dx-slider" data-dx-slider data-dx-min="0" data-dx-max="100" data-dx-step="1" data-dx-value="40">
  <div class="dx-slider-track" data-dx-slider-track>
    <div class="dx-slider-range" data-dx-slider-range></div>
    <div class="dx-slider-handle" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" aria-orientation="horizontal" aria-label="Volume" tabindex="0" data-dx-slider-handle></div>
  </div>
</div>

<div class="dx-slider" data-dx-slider data-dx-min="10" data-dx-max="50" data-dx-step="5" data-dx-value="25">
  <div class="dx-slider-track" data-dx-slider-track>
    <div class="dx-slider-range" data-dx-slider-range></div>
    <div class="dx-slider-handle" role="slider" aria-valuemin="10" aria-valuemax="50" aria-valuenow="25" aria-orientation="horizontal" aria-label="Temperature" tabindex="0" data-dx-slider-handle></div>
  </div>
</div>

<div class="dx-slider" data-dx-slider data-dx-min="0" data-dx-max="100" data-dx-step="1" data-dx-value-min="20" data-dx-value-max="80" data-dx-range>
  <div class="dx-slider-track" data-dx-slider-track>
    <div class="dx-slider-range" data-dx-slider-range></div>
    <div class="dx-slider-handle" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20" aria-orientation="horizontal" aria-label="Min price" tabindex="0" data-dx-slider-handle></div>
    <div class="dx-slider-handle" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" aria-orientation="horizontal" aria-label="Max price" tabindex="-1" data-dx-slider-handle data-dx-slider-handle-max></div>
  </div>
</div>

<div class="dx-slider dx-slider--vertical" data-dx-slider data-dx-min="0" data-dx-max="100" data-dx-step="1" data-dx-value="70" data-dx-orientation="vertical">
  <div class="dx-slider-track" data-dx-slider-track>
    <div class="dx-slider-range" data-dx-slider-range></div>
    <div class="dx-slider-handle" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" aria-orientation="vertical" aria-label="Volume" tabindex="0" data-dx-slider-handle></div>
  </div>
</div>

<div class="dx-slider dx-slider--disabled" data-dx-slider data-dx-min="0" data-dx-max="100" data-dx-step="1" data-dx-value="35" data-dx-disabled>
  <div class="dx-slider-track" data-dx-slider-track>
    <div class="dx-slider-range" data-dx-slider-range></div>
    <div class="dx-slider-handle" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35" aria-orientation="horizontal" aria-label="Disabled" tabindex="0" data-dx-slider-handle></div>
  </div>
</div>
