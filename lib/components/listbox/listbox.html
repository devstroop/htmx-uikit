<!--
  Listbox — reference markup for server templates.
  Root: <div role="listbox" tabindex="0" class="dx-listbox" aria-label="..."
        aria-activedescendant="<option-id>" aria-multiselectable="false|true"
        data-dx-listbox>
  Modifiers:
    mode    data-dx-listbox-multiple   (multi-select; omit for single)
            aria-multiselectable must be "true" with the multiple modifier
            and "false" otherwise (required by the listbox a11y contract)
  Options: <div role="option" id="..." class="dx-listbox__option"
        data-dx-listbox-option data-dx-listbox-value="<value>"
        aria-selected="true|false">
  Behavior: [data-dx-listbox] handles Arrow keys, Home/End, Space to
  toggle, Enter to commit, and type-ahead. The active option follows
  aria-activedescendant. On change it dispatches dx:listbox-change with
  detail {value} (single) or {values} (multiple). The --selected and
  --active modifiers track aria-selected and the active option.
-->

<div
  role="listbox"
  tabindex="0"
  class="dx-listbox"
  aria-label="Destination"
  aria-activedescendant="lb1-option-1"
  aria-multiselectable="false"
  data-dx-listbox
>
  <div
    role="option"
    id="lb1-option-1"
    class="dx-listbox__option dx-listbox__option--selected"
    data-dx-listbox-option
    data-dx-listbox-value="red"
    aria-selected="true"
  >
    Red
  </div>
  <div
    role="option"
    id="lb1-option-2"
    class="dx-listbox__option"
    data-dx-listbox-option
    data-dx-listbox-value="green"
    aria-selected="false"
  >
    Green
  </div>
  <div
    role="option"
    id="lb1-option-3"
    class="dx-listbox__option"
    data-dx-listbox-option
    data-dx-listbox-value="blue"
    aria-selected="false"
  >
    Blue
  </div>
  <div
    role="option"
    id="lb1-option-4"
    class="dx-listbox__option dx-listbox__option--disabled"
    data-dx-listbox-option
    data-dx-listbox-value="grey"
    aria-selected="false"
    aria-disabled="true"
  >
    Grey (unavailable)
  </div>
</div>

<div
  role="listbox"
  tabindex="0"
  class="dx-listbox"
  aria-label="Languages (multiple)"
  aria-activedescendant="lb2-option-1"
  data-dx-listbox
  data-dx-listbox-multiple
>
  <div
    role="option"
    id="lb2-option-1"
    class="dx-listbox__option dx-listbox__option--selected"
    data-dx-listbox-option
    data-dx-listbox-value="en"
    aria-selected="true"
  >
    English
  </div>
  <div
    role="option"
    id="lb2-option-2"
    class="dx-listbox__option"
    data-dx-listbox-option
    data-dx-listbox-value="es"
    aria-selected="false"
  >
    Spanish
  </div>
  <div
    role="option"
    id="lb2-option-3"
    class="dx-listbox__option dx-listbox__option--selected"
    data-dx-listbox-option
    data-dx-listbox-value="fr"
    aria-selected="true"
  >
    French
  </div>
</div>
