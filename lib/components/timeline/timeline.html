<!--
  Timeline — reference markup for server templates.
  Root: <ol class="dx-timeline" data-dx-timeline role="list" aria-label="Timeline"
        [data-dx-reverse]>
    <li class="dx-timeline-item">
      <span class="dx-timeline-marker" aria-hidden="true"></span>
      <div class="dx-timeline-body">
        <div class="dx-timeline-label">Created</div>
        <div class="dx-timeline-content">Jan 2024</div>
      </div>
    </li>
    ...
  </ol>
  Static; behaviors only apply reverse via [data-dx-reverse] CSS. No events.
-->

<ol class="dx-timeline" data-dx-timeline role="list" aria-label="Timeline">
  <li class="dx-timeline-item">
    <span class="dx-timeline-marker" aria-hidden="true"></span>
    <div class="dx-timeline-body">
      <div class="dx-timeline-label">Created</div>
      <div class="dx-timeline-content">Jan 2024</div>
    </div>
  </li>
  <li class="dx-timeline-item">
    <span class="dx-timeline-marker" aria-hidden="true"></span>
    <div class="dx-timeline-body">
      <div class="dx-timeline-label">Shipped</div>
      <div class="dx-timeline-content">Feb 2024</div>
    </div>
  </li>
</ol>

<ol class="dx-timeline" data-dx-timeline data-dx-reverse role="list" aria-label="Timeline (reverse)">
  <li class="dx-timeline-item"><span class="dx-timeline-marker" aria-hidden="true"></span><div class="dx-timeline-body"><div class="dx-timeline-label">Latest first</div></div></li>
  <li class="dx-timeline-item"><span class="dx-timeline-marker" aria-hidden="true"></span><div class="dx-timeline-body"><div class="dx-timeline-label">Older</div></div></li>
</ol>
