<!--
  Mask — reference markup for server templates.
  Root: <input class="dx-mask dx-mask--<size>" type="text"
        data-dx-mask="<format>" [placeholder="(123) 456-7890"]>
  The data-dx-mask format uses "#" for digit placeholders and any other
  character as a literal separator (e.g. "(###) ###-####" for phones,
  "##/##/####" for dates). behaviors.js formats digits on input, drops
  characters beyond the last placeholder, and Backspace over a separator
  also removes the digit before it. All other input attributes forward.
  Modifiers: size --xs..--xl (default --md), state --invalid.
-->

<input class="dx-mask dx-mask--md" type="text" data-dx-mask="(###) ###-####" placeholder="(123) 456-7890" />
<input class="dx-mask dx-mask--md" type="text" data-dx-mask="##/##/####" placeholder="MM/DD/YYYY" />
<input class="dx-mask dx-mask--sm" type="text" data-dx-mask="###-##-####" placeholder="123-45-6789" />
<input class="dx-mask dx-mask--md dx-mask--invalid" type="text" data-dx-mask="(###) ###-####" aria-invalid="true" placeholder="Invalid" />
<input class="dx-mask dx-mask--md" type="text" data-dx-mask="(###) ###-####" placeholder="Disabled" disabled />
