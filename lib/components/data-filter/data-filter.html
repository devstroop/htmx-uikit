<!--
  DataFilter — declarative filter-expression builder (Radzen RadzenDataFilter
  parity). Server renders the shell; behaviors.js drives it.

  Attributes on [data-dx-datafilter]:
    data-dx-datafilter-properties   JSON: [{name, title?, type,
                                     values?: [{value,label}]}]
    data-dx-datafilter-operator     "And" | "Or" (default "And")
    data-dx-datafilter-output       optional selector for a hidden input
                                    receiving the descriptor JSON
  Rows are [data-dx-datafilter-row] containing:
    [data-dx-datafilter-property]   <select>  (options auto-populated)
    [data-dx-datafilter-operator]   <select>  (options swap per type)
    [data-dx-datafilter-value]      value editor (input/select per type)
    [data-dx-datafilter-remove]     <button>  removes the row (keeps one)
  [data-dx-datafilter-add] appends a row cloned from the first row.

  Behavior fires dx:filter-change on the container after any change, with
  detail { filters, filterString, oDataFilterString, logicalOperator }.
  Rows with an empty value are ignored (Radzen canFilter parity) unless
  the operator is a null/empty test.

  See specs/components/data-filter.md for the full contract.
-->

<div class="dx-datafilter" data-dx-datafilter
     data-dx-datafilter-properties='[{"name":"name","title":"Name","type":"string"},{"name":"age","title":"Age","type":"number"},{"name":"active","title":"Active","type":"boolean"}]'
     data-dx-datafilter-operator="And">
  <div class="dx-datafilter-rows" data-dx-datafilter-rows>
    <div class="dx-datafilter-row" data-dx-datafilter-row>
      <label class="dx-datafilter-label">Name
        <select class="dx-select" data-dx-datafilter-property aria-label="Property"></select>
      </label>
      <label class="dx-datafilter-label">Operator
        <select class="dx-select" data-dx-datafilter-operator aria-label="Operator"></select>
      </label>
      <label class="dx-datafilter-label">Value
        <input class="dx-input dx-input--md" data-dx-datafilter-value aria-label="Value">
      </label>
      <button type="button" class="dx-btn" data-dx-datafilter-remove aria-label="Remove condition">×</button>
    </div>
  </div>
  <div class="dx-datafilter-bar">
    <button type="button" class="dx-btn dx-btn--secondary" data-dx-datafilter-add>Add filter</button>
    <div class="dx-datafilter-operator-bar" role="radiogroup" aria-label="Join filters">
      <label><input type="radio" name="df-op" value="And" checked> AND</label>
      <label><input type="radio" name="df-op" value="Or"> OR</label>
    </div>
    <input type="hidden" data-dx-datafilter-output name="filters">
  </div>
</div>
