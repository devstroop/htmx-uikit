<!--
  SignaturePad — reference markup for server templates.
  Root: <div class="dx-signaturepad" data-dx-signaturepad
        [data-dx-pen-color="#1c1c1c"] [data-dx-pen-width="2.5"]>
    <div class="dx-signaturepad-header">
      <span class="dx-signaturepad-label">Signature</span>
      <button class="dx-signaturepad-clear" type="button"
              data-dx-signaturepad-clear>Clear</button>
    </div>
    <canvas class="dx-signaturepad-canvas" role="img" aria-label="Signature"
            data-dx-signaturepad-canvas></canvas>
  behaviors.js wires pointer drawing (mouse/pen/touch), DPR-aware sizing,
  and dispatches dx:signature-change with the PNG data URL on stroke end.
-->

<div class="dx-signaturepad" data-dx-signaturepad>
  <div class="dx-signaturepad-header">
    <span class="dx-signaturepad-label">Signature</span>
    <button class="dx-signaturepad-clear" type="button" data-dx-signaturepad-clear>Clear</button>
  </div>
  <canvas class="dx-signaturepad-canvas" role="img" aria-label="Signature" data-dx-signaturepad-canvas></canvas>
</div>

<div class="dx-signaturepad" data-dx-signaturepad data-dx-pen-color="#1d4ed8">
  <div class="dx-signaturepad-header">
    <span class="dx-signaturepad-label">Signature (blue)</span>
    <button class="dx-signaturepad-clear" type="button" data-dx-signaturepad-clear>Clear</button>
  </div>
  <canvas class="dx-signaturepad-canvas" role="img" aria-label="Signature" data-dx-signaturepad-canvas></canvas>
</div>

<div class="dx-signaturepad" data-dx-signaturepad>
  <div class="dx-signaturepad-header">
    <span class="dx-signaturepad-label">Signature (disabled)</span>
    <button class="dx-signaturepad-clear" type="button" data-dx-signaturepad-clear disabled>Clear</button>
  </div>
  <canvas class="dx-signaturepad-canvas" role="img" aria-label="Signature" data-dx-signaturepad-canvas data-dx-disabled></canvas>
</div>
