<!--
  Radiobuttonlist — reference markup for server templates.
  Root: <fieldset class="dx-radiobuttonlist">
  Children:
    <legend class="dx-radiobuttonlist__legend"> (accessible group name)
    <ul class="dx-radiobuttonlist__list">
      <li class="dx-radiobuttonlist__item"> with
        <label class="dx-radiobuttonlist__label"><input type="radio"
          class="dx-radiobuttonlist__radio" name value> Label text</label>
  Native input behavior only (same name groups, checked/disabled
  forwarded); no data hooks. Note the --disabled modifier pairs with the
  input's disabled attribute.
-->

<fieldset class="dx-radiobuttonlist">
  <legend class="dx-radiobuttonlist__legend">Delivery</legend>
  <ul class="dx-radiobuttonlist__list">
    <li class="dx-radiobuttonlist__item">
      <label class="dx-radiobuttonlist__label">
        <input type="radio" class="dx-radiobuttonlist__radio" name="delivery" value="standard" checked />
        Standard (2–4 days)
      </label>
    </li>
    <li class="dx-radiobuttonlist__item">
      <label class="dx-radiobuttonlist__label">
        <input type="radio" class="dx-radiobuttonlist__radio" name="delivery" value="express" />
        Express (next day)
      </label>
    </li>
    <li class="dx-radiobuttonlist__item">
      <label class="dx-radiobuttonlist__label">
        <input type="radio" class="dx-radiobuttonlist__radio" name="delivery" value="same-day" />
        Same day
      </label>
    </li>
    <li class="dx-radiobuttonlist__item dx-radiobuttonlist__item--disabled">
      <label class="dx-radiobuttonlist__label">
        <input type="radio" class="dx-radiobuttonlist__radio" name="delivery" value="drone" disabled />
        Drone (unavailable)
      </label>
    </li>
  </ul>
</fieldset>

<fieldset class="dx-radiobuttonlist">
  <legend class="dx-radiobuttonlist__legend">Plan</legend>
  <ul class="dx-radiobuttonlist__list">
    <li class="dx-radiobuttonlist__item">
      <label class="dx-radiobuttonlist__label">
        <input type="radio" class="dx-radiobuttonlist__radio" name="plan" value="free" />
        Free
      </label>
    </li>
    <li class="dx-radiobuttonlist__item">
      <label class="dx-radiobuttonlist__label">
        <input type="radio" class="dx-radiobuttonlist__radio" name="plan" value="pro" checked />
        Pro
      </label>
    </li>
    <li class="dx-radiobuttonlist__item">
      <label class="dx-radiobuttonlist__label">
        <input type="radio" class="dx-radiobuttonlist__radio" name="plan" value="enterprise" />
        Enterprise
      </label>
    </li>
  </ul>
</fieldset>
