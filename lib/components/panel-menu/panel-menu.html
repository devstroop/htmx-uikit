<!--
  PanelMenu — reference markup for server templates.
  Root: <nav class="dx-panelmenu [dx-panelmenu--icon-only]"
        data-dx-panelmenu [data-dx-multiple] [data-dx-show-arrow="true|false"]
        [data-dx-display-style="icon|iconAndText"] aria-label="Panel menu">
    <div class="dx-panelmenu-list" role="presentation"
         data-dx-panelmenu-list>
      <div class="dx-panelmenu-item" data-dx-panelmenu-item-wrapper>
        <button type="button" class="dx-panelmenu-trigger"
                data-dx-panelmenu-trigger data-dx-panelmenu-item
                data-dx-text="Item" [data-dx-value="val"]
                [data-dx-path="/path"] [data-index="0"]
                [aria-haspopup] [aria-expanded] [aria-controls]
                [aria-disabled] [disabled] tabindex>
          [<span class="dx-panelmenu-icon" aria-hidden="true">icon</span>]
          <span class="dx-panelmenu-text">Label</span>
          [<span class="dx-panelmenu-caret" aria-hidden="true">▾</span>]
        </button>
        [<div id role="menu" class="dx-panelmenu-submenu"
              data-dx-panelmenu-submenu aria-labelledby>
           <div role="menuitem" class="dx-panelmenu-submenu-item"
                data-dx-panelmenu-item data-dx-text="Child" tabindex>
                ... child triggers or leaf ...
           </div>
         </div>]
      </div>
    </div>
  </nav>
  behaviors.js toggles aria-expanded and hidden on triggers/submenus, respects
  data-dx-multiple (allow many open) versus single-open, honors
  data-dx-show-arrow to hide carets, handles displayStyle icon/iconAndText
  (iconOnly hides text), and dispatches dx:panelmenu-click{ text, value, path }
  on leaf activation. Keyboard: Enter/Space toggles or activates, ArrowUp/Down
  moves, Escape collapses, Home/End.
-->

<!-- Default single-expand -->
<nav class="dx-panelmenu" data-dx-panelmenu aria-label="Panel menu">
  <div class="dx-panelmenu-list" data-dx-panelmenu-list role="presentation">
    <div class="dx-panelmenu-item" data-dx-panelmenu-item-wrapper>
      <button type="button" class="dx-panelmenu-trigger" data-dx-panelmenu-trigger data-dx-panelmenu-item data-dx-text="Dashboard" data-dx-value="dashboard" data-index="0" tabindex="0">
        <span class="dx-panelmenu-icon" aria-hidden="true">▦</span>
        <span class="dx-panelmenu-text">Dashboard</span>
      </button>
    </div>
    <div class="dx-panelmenu-item" data-dx-panelmenu-item-wrapper>
      <button type="button" class="dx-panelmenu-trigger" data-dx-panelmenu-trigger data-dx-panelmenu-item data-dx-text="Reports" data-index="1" aria-haspopup="menu" aria-expanded="false" aria-controls="pm-submenu-1" tabindex="0">
        <span class="dx-panelmenu-icon" aria-hidden="true">📊</span>
        <span class="dx-panelmenu-text">Reports</span>
        <span class="dx-panelmenu-caret" aria-hidden="true">▾</span>
      </button>
      <div id="pm-submenu-1" role="menu" class="dx-panelmenu-submenu" data-dx-panelmenu-submenu aria-labelledby="pm-trigger-1" hidden>
        <div role="menuitem" class="dx-panelmenu-submenu-item" data-dx-panelmenu-item data-dx-text="Monthly" data-dx-value="monthly" tabindex="-1">Monthly</div>
        <div role="menuitem" class="dx-panelmenu-submenu-item" data-dx-panelmenu-item data-dx-text="Annual" data-dx-value="annual" tabindex="-1">Annual</div>
        <div role="menuitem" class="dx-panelmenu-submenu-item dx-panelmenu-item--disabled" data-dx-panelmenu-item data-dx-text="Custom" aria-disabled="true" tabindex="-1">Custom</div>
      </div>
    </div>
    <div class="dx-panelmenu-item" data-dx-panelmenu-item-wrapper>
      <button type="button" class="dx-panelmenu-trigger" data-dx-panelmenu-trigger data-dx-panelmenu-item data-dx-text="Settings" data-dx-value="settings" data-index="2" aria-haspopup="menu" aria-expanded="false" aria-controls="pm-submenu-2" tabindex="0">
        <span class="dx-panelmenu-icon" aria-hidden="true">⚙</span>
        <span class="dx-panelmenu-text">Settings</span>
        <span class="dx-panelmenu-caret" aria-hidden="true">▾</span>
      </button>
      <div id="pm-submenu-2" role="menu" class="dx-panelmenu-submenu" data-dx-panelmenu-submenu aria-labelledby="pm-trigger-2" hidden>
        <div role="menuitem" class="dx-panelmenu-submenu-item" data-dx-panelmenu-item data-dx-text="General" data-dx-value="general" tabindex="-1">General</div>
        <div role="menuitem" class="dx-panelmenu-submenu-item" data-dx-panelmenu-item data-dx-text="Security" data-dx-value="security" tabindex="-1">Security</div>
      </div>
    </div>
  </div>
</nav>

<!-- Multiple expand + showArrow false -->
<nav class="dx-panelmenu" data-dx-panelmenu data-dx-multiple aria-label="Panel menu (multiple)">
  <div class="dx-panelmenu-list" data-dx-panelmenu-list role="presentation">
    <div class="dx-panelmenu-item" data-dx-panelmenu-item-wrapper>
      <button type="button" class="dx-panelmenu-trigger" data-dx-panelmenu-trigger data-dx-panelmenu-item data-dx-text="Projects" data-index="0" aria-haspopup="menu" aria-expanded="true" aria-controls="pm2-submenu-0" tabindex="0">
        <span class="dx-panelmenu-icon" aria-hidden="true">📁</span>
        <span class="dx-panelmenu-text">Projects</span>
      </button>
      <div id="pm2-submenu-0" role="menu" class="dx-panelmenu-submenu" data-dx-panelmenu-submenu>
        <div role="menuitem" class="dx-panelmenu-submenu-item" data-dx-panelmenu-item data-dx-text="Active" data-dx-value="active" tabindex="0">Active</div>
        <div role="menuitem" class="dx-panelmenu-submenu-item" data-dx-panelmenu-item data-dx-text="Archived" data-dx-value="archived" tabindex="0">Archived</div>
      </div>
    </div>
    <div class="dx-panelmenu-item" data-dx-panelmenu-item-wrapper>
      <button type="button" class="dx-panelmenu-trigger" data-dx-panelmenu-trigger data-dx-panelmenu-item data-dx-text="Team" data-index="1" aria-haspopup="menu" aria-expanded="true" aria-controls="pm2-submenu-1" tabindex="0">
        <span class="dx-panelmenu-icon" aria-hidden="true">👥</span>
        <span class="dx-panelmenu-text">Team</span>
      </button>
      <div id="pm2-submenu-1" role="menu" class="dx-panelmenu-submenu" data-dx-panelmenu-submenu>
        <div role="menuitem" class="dx-panelmenu-submenu-item" data-dx-panelmenu-item data-dx-text="Members" data-dx-value="members" tabindex="0">Members</div>
        <div role="menuitem" class="dx-panelmenu-submenu-item" data-dx-panelmenu-item data-dx-text="Invites" data-dx-value="invites" tabindex="0">Invites</div>
      </div>
    </div>
  </div>
</nav>

<!-- Icon-only displayStyle with disabled -->
<nav class="dx-panelmenu dx-panelmenu--icon-only" data-dx-panelmenu data-dx-display-style="icon" aria-label="Icon panel menu">
  <div class="dx-panelmenu-list" data-dx-panelmenu-list role="presentation">
    <div class="dx-panelmenu-item" data-dx-panelmenu-item-wrapper>
      <button type="button" class="dx-panelmenu-trigger" data-dx-panelmenu-trigger data-dx-panelmenu-item data-dx-text="Home" data-dx-value="home" tabindex="0" aria-label="Home">
        <span class="dx-panelmenu-icon" aria-hidden="true">⌂</span>
        <span class="dx-panelmenu-text">Home</span>
      </button>
    </div>
    <div class="dx-panelmenu-item" data-dx-panelmenu-item-wrapper>
      <button type="button" class="dx-panelmenu-trigger dx-panelmenu-trigger--disabled" data-dx-panelmenu-trigger data-dx-panelmenu-item data-dx-text="Reports" aria-disabled="true" disabled tabindex="-1">
        <span class="dx-panelmenu-icon" aria-hidden="true">📊</span>
        <span class="dx-panelmenu-text">Reports</span>
        <span class="dx-panelmenu-caret" aria-hidden="true">▾</span>
      </button>
    </div>
    <div class="dx-panelmenu-item" data-dx-panelmenu-item-wrapper>
      <button type="button" class="dx-panelmenu-trigger" data-dx-panelmenu-trigger data-dx-panelmenu-item data-dx-text="Settings" data-index="2" aria-haspopup="menu" aria-expanded="false" aria-controls="pm3-submenu-2" tabindex="0" aria-label="Settings">
        <span class="dx-panelmenu-icon" aria-hidden="true">⚙</span>
        <span class="dx-panelmenu-text">Settings</span>
        <span class="dx-panelmenu-caret" aria-hidden="true">▾</span>
      </button>
      <div id="pm3-submenu-2" role="menu" class="dx-panelmenu-submenu" data-dx-panelmenu-submenu hidden>
        <div role="menuitem" class="dx-panelmenu-submenu-item" data-dx-panelmenu-item data-dx-text="General" tabindex="-1">General</div>
      </div>
    </div>
  </div>
</nav>
