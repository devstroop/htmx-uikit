<!--
  Selectbar — reference markup for server templates.
  Root: <div role="group" class="dx-selectbar dx-selectbar--<size>" data-dx-selectbar
        aria-label="...">
  Modifiers:
    size    --sm | --md | --lg     (default: --md)
  Options: <button type="button" class="dx-selectbar__option" aria-pressed="true|false"
        data-dx-selectbar-option data-dx-selectbar-value="<value>">
  Behavior: clicking an option presses it and unpresses the others, then
  dispatches dx:selectbar-change on the group with detail {value}.
  Single-select; for multi-select use dx-togglebutton buttons.
-->

<div role="group" class="dx-selectbar dx-selectbar--md" aria-label="Alignment" data-dx-selectbar>
  <button type="button" class="dx-selectbar__option dx-selectbar__option--selected" aria-pressed="true" data-dx-selectbar-option data-dx-selectbar-value="left">
    Left
  </button>
  <button type="button" class="dx-selectbar__option" aria-pressed="false" data-dx-selectbar-option data-dx-selectbar-value="center">
    Center
  </button>
  <button type="button" class="dx-selectbar__option" aria-pressed="false" data-dx-selectbar-option data-dx-selectbar-value="right">
    Right
  </button>
</div>

<div role="group" class="dx-selectbar dx-selectbar--sm" aria-label="Zoom" data-dx-selectbar>
  <button type="button" class="dx-selectbar__option dx-selectbar__option--selected" aria-pressed="true" data-dx-selectbar-option data-dx-selectbar-value="50">
    50%
  </button>
  <button type="button" class="dx-selectbar__option" aria-pressed="false" data-dx-selectbar-option data-dx-selectbar-value="100">
    100%
  </button>
  <button type="button" class="dx-selectbar__option" aria-pressed="false" data-dx-selectbar-option data-dx-selectbar-value="200">
    200%
  </button>
</div>

<div role="group" class="dx-selectbar dx-selectbar--lg" aria-label="Density" data-dx-selectbar>
  <button type="button" class="dx-selectbar__option dx-selectbar__option--selected" aria-pressed="true" data-dx-selectbar-option data-dx-selectbar-value="compact">
    Compact
  </button>
  <button type="button" class="dx-selectbar__option" aria-pressed="false" data-dx-selectbar-option data-dx-selectbar-value="comfortable" disabled>
    Comfortable
  </button>
  <button type="button" class="dx-selectbar__option" aria-pressed="false" data-dx-selectbar-option data-dx-selectbar-value="spacious">
    Spacious
  </button>
</div>
