<!--
  Toast — reference markup for server templates.
  Viewport: <div class="se-toast-viewport [se-toast-viewport--top-left |
    --top-right | --bottom-left]" data-se-toast aria-live="polite">
    (defaults to bottom-right, the base style; behaviors.js creates or
    reuses a viewport per corner, honoring seToast({ position }))
  Item: <div class="se-toast se-toast--<tone>" data-se-dismissable role="status">
    tone  --info (default) | --success | --warning | --danger
    role  "alert" for danger, "status" otherwise
    optional: data-se-toast-id="<id>"  (seToast with the same id updates it)
              class se-toast--clickable (click dismisses — closeOnClick)
  Parts:
    title    <div class="se-toast-title">
    desc     <div class="se-toast-description">
    actions  <div class="se-toast-actions"> with buttons
             .se-toast-action (primary) and .se-toast-cancel
    dismiss  <button class="se-toast-dismiss" type="button" data-se-dismiss
             aria-label="Dismiss notification">×</button>
             (omit for dismissible=false)
    progress <div class="se-toast-progress" style="animation-duration: 4000ms">
             (bottom duration bar — showProgress; tone-colored)
  Behaviors: hover pauses the auto-dismiss timer (data-paused on the item);
             leaving items animate out over 200ms.
  Static items are rendered by the server; dynamic ones use
  window.seToast({ title, description, tone, durationMs, position, id,
  action: {label, onClick}, cancel: {label, onClick}, dismissible,
  closeOnClick, showProgress, onDismiss, onAutoClose }).
-->

<div class="se-toast-viewport se-toast-viewport--top-left" data-se-toast aria-live="polite"></div>

<div class="se-toast-viewport" data-se-toast aria-live="polite">
  <div class="se-toast se-toast--success" data-se-dismissable role="status">
    <div class="se-toast-content">
      <div class="se-toast-title">Deployed</div>
      <div class="se-toast-description">The release is live.</div>
      <div class="se-toast-actions">
        <button type="button" class="se-toast-action">View release</button>
        <button type="button" class="se-toast-cancel">Dismiss</button>
      </div>
    </div>
    <button class="se-toast-dismiss" type="button" data-se-dismiss aria-label="Dismiss notification">
      ×
    </button>
  </div>
  <div class="se-toast se-toast--danger" data-se-dismissable role="alert">
    <div class="se-toast-content">
      <div class="se-toast-title">Build failed</div>
      <div class="se-toast-description">Check the pipeline logs.</div>
    </div>
    <button class="se-toast-dismiss" type="button" data-se-dismiss aria-label="Dismiss notification">
      ×
    </button>
  </div>
  <div class="se-toast se-toast--warning se-toast--clickable" data-se-dismissable role="status">
    <div class="se-toast-content">
      <div class="se-toast-title">Progress demo</div>
      <div class="se-toast-description">Click anywhere to dismiss.</div>
    </div>
    <div class="se-toast-progress" style="animation-duration: 6000ms"></div>
  </div>
</div>

<script>

</script>
