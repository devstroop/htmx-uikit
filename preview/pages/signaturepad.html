      <div class="page-head">
        <h1>SignaturePad</h1>
        <p class="page-sub">Canvas signature capture with clear and undo.</p>
      </div>
      <section class="demo-section" id="signaturepad">
        <div class="demo-card">
<div class="demo-area">
          <div class="preview-grid">
<div class="dx-signaturepad" data-dx-signaturepad>
  <div class="dx-signaturepad-header">
    <span class="dx-signaturepad-label">Signature</span>
    <button class="dx-signaturepad-clear" type="button" data-dx-signaturepad-clear>Clear</button>
  </div>
  <canvas class="dx-signaturepad-canvas" role="img" aria-label="Signature" data-dx-signaturepad-canvas></canvas>
</div>
          </div>
        </div>
          <div class="kbd-block">
            <h3 class="kbd-title">Keyboard</h3>
            <table class="dx-table kbd-table">
              <thead><tr><th scope="col">Key</th><th scope="col">Action</th></tr></thead>
              <tbody>
                <tr><td class="kbd-keys"><kbd>Tab</kbd></td><td>Focus the Clear button (canvas is pointer-draw)</td></tr>
                <tr><td class="kbd-keys"><kbd>Enter</kbd><span class="kbd-sep">/</span><kbd>Space</kbd></td><td>Clear the canvas (emits onChange)</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
