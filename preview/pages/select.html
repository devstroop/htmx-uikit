      <div class="page-head">
        <h1>Select</h1>
        <p class="page-sub">Native-feel single-select listbox trigger.</p>
      </div>
      <section class="demo-section" id="select">
        <div class="demo-card">
<div class="demo-area dx-form-grid">
<div class="dx-field">
            <label class="dx-field-label" for="htmx-fw">Framework</label>
            <select class="dx-select dx-select--sm" id="htmx-fw-sm" aria-label="Framework (small)">
              <option>Small</option>
            </select>
            <select class="dx-select dx-select--md" id="htmx-fw">
              <option value="react">React</option>
              <option value="htmx" selected>htmx</option>
              <option value="blazor">Blazor</option>
            </select>
            <select class="dx-select dx-select--lg" id="htmx-fw-lg" aria-label="Framework (large)">
              <option>Large</option>
            </select>
          </div>
        </div>
          <div class="kbd-block">
            <h3 class="kbd-title">Keyboard</h3>
            <table class="dx-table kbd-table">
              <thead><tr><th scope="col">Key</th><th scope="col">Action</th></tr></thead>
              <tbody>
                <tr><td class="kbd-keys"><kbd>Arrow keys</kbd></td><td>Move to the next/previous option</td></tr>
                <tr><td class="kbd-keys"><kbd>Letter keys</kbd></td><td>Typeahead — jump to a matching option</td></tr>
                <tr><td class="kbd-keys"><kbd>Tab</kbd></td><td>Leave the select; the selection is kept</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
