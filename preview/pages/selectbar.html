      <div class="page-head">
        <h1>SelectBar</h1>
        <p class="page-sub">Segmented button group acting as a select.</p>
      </div>
      <section class="demo-section" id="selectbar">
        <div class="demo-card">
<div class="demo-area">
          <div class="preview-grid">
            <div role="group" class="dx-selectbar dx-selectbar--md" aria-label="Alignment" data-dx-selectbar>
              <button type="button" class="dx-selectbar__option dx-selectbar__option--selected" aria-pressed="true" data-dx-selectbar-option data-dx-selectbar-value="left">Left</button>
              <button type="button" class="dx-selectbar__option" aria-pressed="false" data-dx-selectbar-option data-dx-selectbar-value="center">Center</button>
              <button type="button" class="dx-selectbar__option" aria-pressed="false" data-dx-selectbar-option data-dx-selectbar-value="right">Right</button>
            </div>
            <div role="group" class="dx-selectbar dx-selectbar--sm" aria-label="Zoom" data-dx-selectbar>
              <button type="button" class="dx-selectbar__option dx-selectbar__option--selected" aria-pressed="true" data-dx-selectbar-option data-dx-selectbar-value="50">50%</button>
              <button type="button" class="dx-selectbar__option" aria-pressed="false" data-dx-selectbar-option data-dx-selectbar-value="100">100%</button>
              <button type="button" class="dx-selectbar__option" aria-pressed="false" data-dx-selectbar-option data-dx-selectbar-value="200" disabled>200%</button>
            </div>
          </div>
        </div>
          <div class="kbd-block">
            <h3 class="kbd-title">Keyboard</h3>
            <table class="dx-table kbd-table">
              <thead><tr><th scope="col">Key</th><th scope="col">Action</th></tr></thead>
              <tbody>
                <tr><td class="kbd-keys"><kbd>Tab</kbd></td><td>Move between the option buttons</td></tr>
                <tr><td class="kbd-keys"><kbd>Enter</kbd><span class="kbd-sep">/</span><kbd>Space</kbd></td><td>Press the focused option (aria-pressed flips)</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
