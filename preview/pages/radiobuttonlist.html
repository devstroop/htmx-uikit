      <div class="page-head">
        <h1>RadioButtonList</h1>
        <p class="page-sub">Single-choice radio group with roving arrow keys.</p>
      </div>
      <section class="demo-section" id="radiobuttonlist">
        <div class="demo-card">
<div class="demo-area">
          <div class="preview-grid">
            <fieldset class="dx-radiobuttonlist">
              <legend class="dx-radiobuttonlist__legend">Delivery</legend>
              <ul class="dx-radiobuttonlist__list">
                <li class="dx-radiobuttonlist__item">
                  <label class="dx-radiobuttonlist__label">
                    <input type="radio" class="dx-radiobuttonlist__radio" name="pv-delivery" value="standard" checked />
                    Standard (2–4 days)
                  </label>
                </li>
                <li class="dx-radiobuttonlist__item">
                  <label class="dx-radiobuttonlist__label">
                    <input type="radio" class="dx-radiobuttonlist__radio" name="pv-delivery" value="express" />
                    Express (next day)
                  </label>
                </li>
                <li class="dx-radiobuttonlist__item dx-radiobuttonlist__item--disabled">
                  <label class="dx-radiobuttonlist__label">
                    <input type="radio" class="dx-radiobuttonlist__radio" name="pv-delivery" value="drone" disabled />
                    Drone (unavailable)
                  </label>
                </li>
              </ul>
            </fieldset>
          </div>
        </div>
          <div class="kbd-block">
            <h3 class="kbd-title">Keyboard</h3>
            <table class="dx-table kbd-table">
              <thead><tr><th scope="col">Key</th><th scope="col">Action</th></tr></thead>
              <tbody>
                <tr><td class="kbd-keys"><kbd>Tab</kbd></td><td>Enter the group — focus lands on the selected (or first) radio</td></tr>
                <tr><td class="kbd-keys"><kbd>Arrow keys</kbd></td><td>Move and select within the group</td></tr>
                <tr><td class="kbd-keys"><kbd>Space</kbd></td><td>Select the focused radio</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
