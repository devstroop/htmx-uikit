      <div class="page-head">
        <h1>Fieldset</h1>
        <p class="page-sub">Grouped form section with legend, collapse toggle, and summary.</p>
      </div>
      <section class="demo-section" id="fieldset">
        <div class="demo-card">
<div class="demo-area">
          <fieldset class="dx-fieldset">
            <legend class="dx-fieldset__legend">Contact details</legend>
            <div class="dx-fieldset__content">
              <p class="dx-text">Name, email, and phone inputs go here.</p>
            </div>
          </fieldset>
</div>
        </div>
      </section>
      <section class="demo-section" id="fieldset-collapse">
        <div class="demo-card">
<div class="demo-area">
          <fieldset class="dx-fieldset">
            <legend class="dx-fieldset__legend">
              <button
                type="button"
                class="dx-fieldset__toggle"
                aria-expanded="true"
                aria-controls="page-fieldset-content"
                data-fieldset-toggle
              >
                <span aria-hidden="true">−</span>
                <span>Advanced options</span>
              </button>
            </legend>
            <div class="dx-fieldset__content" id="page-fieldset-content">
              <p class="dx-text">Extra settings visible while expanded.</p>
            </div>
            <div class="dx-fieldset__summary" id="page-fieldset-summary" hidden>
              <p class="dx-text">3 advanced settings hidden.</p>
            </div>
          </fieldset>
</div>
        </div>
      </section>
